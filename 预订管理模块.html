function configLogDetails(entry){
 const raw=String(entry.detail||''),start=raw.indexOf('{');let value=null;
 if(start>=0){try{value=JSON.parse(raw.slice(start))}catch{}}
 const description=start>=0?raw.slice(0,start).replace(/[：:\s]+$/,''):raw;
 const rows=[['设置类型',entry.type],['操作说明',description||'配置变更'],['操作时间',entry.time],['操作人',entry.operator],['确认人',entry.confirmer]];
 if(value&&typeof value==='object'){
  const labels={name:entry.type+'名称',en:'英文名称',hall:'所属厅',enabled:'状态'};
  if(entry.type==='签证')Object.assign(labels,{name:'签证类型',price:'现金价（万）',points:'积分价（点）'});
  if(entry.type==='车辆')Object.assign(labels,{plate:'车号',price:'价格（万）',points:'所需积分（点）'});
  if(entry.type==='房型')Object.assign(labels,{price:'平日价格（万）',points:'平日所需积分（点）',weekend:'周末价格（万）',weekpoints:'周末所需积分（点）'});
  if(value.tariffs)for(const [k,p] of Object.entries(value.tariffs)){rows.push([k.replace('|',' · ')+'现金价（万）',num(p.cash)],[k.replace('|',' · ')+'积分价（点）',p.points])}
  for(const [key,label] of Object.entries(labels)){if(value[key]===undefined)continue;let display=value[key];if(key==='enabled')display=value[key]?'启用':'禁用';if(key==='hall')display=({WBYD:'WBYD-1F',WBYDAGS:'WBYD2F',WBYDBANK:'WBYD3H'})[display]||display;if(['price','weekend'].includes(key))display=num(display);rows.push([label,display]);}
 }
 return '<dl class="config-log-details">'+rows.map(([label,value])=>'<div><dt>'+esc(label)+'</dt><dd>'+esc(value??'—')+'</dd></div>').join('')+'</dl>';
}
