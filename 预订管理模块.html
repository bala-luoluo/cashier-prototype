function repaySelectedAdvances(){const ids=$$('[data-advance-select]:checked').map(e=>e.dataset.advanceSelect);try{const rows=allocateAdvanceRepayment(ids,'0.0001'),first=rows[0].o,total=rows.reduce((n,r)=>n+debt(r.o),0);openDialog('批量代垫还款',`<p>户口：${esc(first.account)} · ${esc(first.currency)} · 已选 ${rows.length} 笔 · 待还合计 ${num(total)} 万</p><div class="grid">${select('还款方式','method',['户口余额','现金','积分'],'户口余额',true)}${field('还款／折抵金额（万）','amount',num(total),'number',true)}${field('还款积分（积分还款时填写）','points','0','number')}${field('备注','note')}</div><p class="hint">按订单创建时间从早到晚分配；可部分还款。积分还款需手动填写总积分和折抵金额。</p><div id="bulk-repay-preview"></div>`,f=>commitBulkRepayment(ids,f));const f=$('form',$('#dialog')),preview=()=>{try{const allocation=allocateAdvanceRepayment(ids,f.amount.value);$('#bulk-repay-preview').innerHTML=table(['预定单号','待还（万）','本次还款（万）','还后待还（万）'],allocation.map(({o,units})=>[esc(o.id),num(debt(o)),num(units/10000),num(debt(o)-units/10000)]))}catch(e){$('#bulk-repay-preview').textContent=e.message}};f.amount.oninput=preview;preview()}catch(e){toast(e.message)}}
function commitBulkRepayment(ids,f){const allocation=allocateAdvanceRepayment(ids,f.amount.value),method=f.method.value,points=method==='积分'?money(f.points.value):0,total=consumptionUnits(f.amount.value);if(!['户口余额','现金','积分'].includes(method))throw Error('请选择还款方式');if(method==='积分'&&points<=0)throw Error('请输入还款积分');const pointUnits=consumptionUnits(points),plan={money:[],points:[],till:[]};let cumulative=0,allocatedPoints=0;const portions=allocation.filter(r=>r.units>0).map(({o,units})=>{cumulative+=units;const through=Number(BigInt(pointUnits)*BigInt(cumulative)/BigInt(total)),portion=through-allocatedPoints;allocatedPoints=through;if(method==='户口余额')plan.money.push({account:o.account,currency:o.currency,units:-units},{account:o.company,currency:o.currency,units});if(method==='现金'){if(!halls.includes(o.company))plan.money.push({account:o.company,currency:o.currency,units});plan.till.push({hall:o.hall,currency:o.currency,units})}return {o,units,points:portion/10000}});if(method==='积分')plan.points.push({account:allocation[0].o.account,amount:-points},{account:consumptionBinding('积分中转户口'),amount:points});const batch=uid('BR'),time=stamp();bookingHost().post({...plan,id:batch,hall:allocation[0].o.hall,note:'批量代垫还款 · '+method});for(const {o,units,points:p} of portions){o.paid=(consumptionUnits(o.paid||0)+units)/10000;db.repayments.unshift({order:o.id,batch,account:o.account,currency:o.currency,method,amount:units/10000,points:p,time,note:f.note.value});o.history.push({time,note:'批量还款 '+batch+' · '+num(units/10000)+' 万；'+method+'；'+f.note.value});db.ledger.unshift({no:batch,order:o.id,account:o.account,kind:o.type,pay:method,amount:units/10000,points:p,time,note:'批量代垫还款'})}}
function repayReservation(id){const o=db.consumptions.find(o=>o.id===id);openDialog('代垫还款 · '+o.id,`<p>待还：${num(debt(o))} 万 ${o.currency}</p><div class="grid">${select('还款方式','method',['户口余额','现金','积分'],'户口余额',true)}${field('还款／折抵金额（万）','amount','','number',true)}${field('还款积分（积分还款时填写）','points','0','number')}${field('备注','note')}</div><p class="hint">积分还款需同时填写积分数和折抵金额；现金输入实收金额并增加本厅现金银头。</p>`,f=>{const amount=money(f.amount.value),points=money(f.points.value),method=f.method.value,u=consumptionUnits(amount);if(u<=0||amount>debt(o))throw Error('还款金额须大于0且不超过待还金额');const plan={money:[],points:[],till:[]};if(method==='户口余额')plan.money.push({account:o.account,currency:o.currency,units:-u},{account:o.company,currency:o.currency,units:u});if(method==='现金'){if(!halls.includes(o.company))plan.money.push({account:o.company,currency:o.currency,units:u});plan.till.push({hall:o.hall,currency:o.currency,units:u})}if(method==='积分'){if(points<=0)throw Error('请输入还款积分');plan.points.push({account:o.account,amount:-points},{account:consumptionBinding('积分中转户口'),amount:points})}postConsumption(o,plan,'代垫还款 · '+method);o.paid=Math.round((Number(o.paid)+amount)*10000)/10000;const row={order:o.id,account:o.account,currency:o.currency,method,amount,points:method==='积分'?points:0,time:stamp(),note:f.note.value};db.repayments.unshift(row);o.history.push({time:row.time,note:'还款 '+num(amount)+' 万；'+method+'；'+f.note.value})})}
const seasonalKeys=['淡季|含早餐','淡季|不含早餐','旺季|含早餐','旺季|不含早餐'];
function renderSeasonalSettings(){const h=db.hotels.find(h=>h.id===hotel);$('#main').innerHTML=`<h2>酒店设置</h2><div class="tabs">${halls.map(v=>`<button data-season-hall="${v}" class="${hall===v?'active':''}">${v}</button>`).join('')}</div><div class="config-bar">${db.hotels.filter(h=>h.hall===hall&&h.enabled).map(h=>`<button data-season-hotel="${h.id}" class="${hotel===h.id?'primary':''}">${esc(h.name)}</button>`).join('')}<span class="spacer"></span><button id="season-hotels">酒店类别</button><button id="season-towers" ${!h?'disabled':''}>Tower类别</button></div>${db.towers.filter(t=>t.hotel===hotel&&t.enabled).map(t=>`<h3>${esc(t.name)}</h3><div class="toolbar"><button data-season-add="${t.id}">新增房型</button></div>${table(['房型',...seasonalKeys.map(k=>esc(k.replace('|',' · '))+'<br>现金价（万）／积分价（点）'),'状态','操作'],db.rooms.filter(r=>r.tower===t.id).map(r=>[esc(r.name),...seasonalKeys.map(k=>r.tariffs?.[k]?num(r.tariffs[k].cash)+' / '+r.tariffs[k].points:'未设置'),r.enabled?'启用':'禁用',`<button data-season-edit="${r.id}">编辑</button>`]))}`).join('')||'<p class="empty">请先配置酒店与Tower类别</p>'}<h3 style="margin-top:24px">设置操作记录</h3>${table(['时间','类型','操作说明','操作'],db.logs.filter(l=>['酒店','Tower','房型'].includes(l.type)).map(l=>[l.time,l.type,esc(l.detail.split('：')[0]),`<button data-season-log="${l.no}">详情</button>`]))}`;$$('[data-season-hall]').forEach(b=>b.onclick=()=>{hall=b.dataset.seasonHall;hotel=db.hotels.find(h=>h.hall===hall)?.id||'';render()});$$('[data-season-hotel]').forEach(b=>b.onclick=()=>{hotel=b.dataset.seasonHotel;render()});$('#season-hotels').onclick=()=>configList('hotels');$('#season-towers').onclick=()=>configList('towers');$$('[data-season-edit]').forEach(b=>b.onclick=()=>editSeasonalRoom(b.dataset.seasonEdit));$$('[data-season-add]').forEach(b=>b.onclick=()=>editSeasonalRoom(null,b.dataset.seasonAdd));$$('[data-season-log]').forEach(b=>b.onclick=()=>openDialog('设置记录详情',configLogDetails(db.logs.find(l=>l.no===b.dataset.seasonLog)),null))}
function editSeasonalRoom(id,tower){const r=db.rooms.find(r=>r.id===id)||{name:'',en:'',enabled:true,tower};openDialog((id?'编辑':'新增')+'房型',`<div class="grid">${field('房型名称','name',r.name,'text',true)}${field('英文名称','en',r.en)}${select('状态','enabled',['启用','禁用'],r.enabled?'启用':'禁用',true)}</div>${seasonalKeys.map((k,i)=>`<h3 style="margin-top:22px">${k.replace('|',' · ')}</h3><div class="grid">${field('现金价（万／晚）','cash'+i,r.tariffs?.[k]?.cash??'','number',true)}${field('积分价（点／晚）','points'+i,r.tariffs?.[k]?.points??'','number',true)}</div>`).join('')}`,f=>{const name=f.elements.name.value.trim();if(!name)throw Error('请填写房型名称');if(db.rooms.some(v=>v.id!==id&&v.tower===r.tower&&v.name===name))throw Error('同一Tower内房型不能重复');const tariffs=Object.fromEntries(seasonalKeys.map((k,i)=>[k,{cash:money(f.elements['cash'+i].value),points:money(f.elements['points'+i].value)}]));const value={...r,id:id||uid('room'),name,en:f.en.value,enabled:f.enabled.value==='启用',tariffs};if(id)db.rooms=db.rooms.map(v=>v.id===id?value:v);else db.rooms.push(value);log('房型',(id?'编辑 ':'新增 ')+name+'：'+JSON.stringify(value))})}

const initial=new URLSearchParams(location.search).get('page');if(initial==='allBookings'){page='categoryBookings';history.replaceState(null,'','?page=categoryBookings')}else if(titles[initial])page=initial;render();

// Keep action columns accessible while horizontally scrolling any list.
(()=>{let queued=false;function pinActions(){queued=false;document.querySelectorAll('table').forEach(table=>{const header=table.tHead?.rows[table.tHead.rows.length-1]||table.querySelector('tr');if(!header)return;const cells=[...header.cells],index=cells.findIndex(cell=>/^(操作|操作栏)$/.test(cell.textContent.trim()));if(index<0)return;table.classList.add('fixed-actions-table');for(const row of table.rows){const cell=row.cells[index];if(cell&&cell.colSpan===1&&row.cells.length===cells.length)cell.classList.add('fixed-action-cell');}})}new MutationObserver(()=>{if(!queued){queued=true;requestAnimationFrame(pinActions)}}).observe(document.body,{childList:true,subtree:true});pinActions();})();
</script></body></html>
