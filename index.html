function inDateRange(time,start,end){let normalize=(s,last=false)=>s.replace('T',' ')+(s.length===10?(last?' 23:59:59':' 00:00:00'):s.length===16?':00':'');let t=normalize(time);return (!start||t>=normalize(start))&&(!end||t<=normalize(end,true))}
function dateSearch(key,startId,endId,start='',end='',search='',reset=''){return `<div class="date-search" data-date-key="${key}"><span class="date-search-label">时间</span><div class="date-shortcuts">${['今天','昨天','本周','上周','本月','上月','自定义'].map((t,i)=>`<button type="button" data-preset="${i}" class="${i===6&&(start||end)?'selected':''}" onclick="chooseDates('${key}','${startId}','${endId}',${i})">${t}</button>`).join('')}</div><input type="hidden" id="${startId}" value="${start}"><input type="hidden" id="${endId}" value="${end}"><button type="button" class="date-range-trigger" aria-haspopup="dialog" onclick="openDateCalendar('${key}','${startId}','${endId}')"><span aria-hidden="true">▦</span><span id="date-label-${key}">${start||'开始时间'}　至　${end||'结束时间'}</span></button><button class="date-search-submit" onclick="${search}">⌕ 搜索</button><button class="date-search-reset" onclick="${reset}">↻ 重置</button></div>`}
function dateCustom(key){document.querySelectorAll('[data-date-key="'+key+'"] [data-preset]').forEach(b=>b.classList.toggle('selected',b.dataset.preset==='6'))}
function searchDateBounds(i,today){let start=new Date(today.getFullYear(),today.getMonth(),today.getDate()),end=new Date(start);if(i===1){start.setDate(start.getDate()-1);end=new Date(start)}if(i===2||i===3){let offset=(start.getDay()+6)%7;start.setDate(start.getDate()-offset-(i===3?7:0));if(i===3){end=new Date(start);end.setDate(end.getDate()+6)}}if(i===4)start.setDate(1);if(i===5){start=new Date(start.getFullYear(),start.getMonth()-1,1);end=new Date(start.getFullYear(),start.getMonth()+1,0)}let fmt=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');return [fmt(start),fmt(end)]}
function chooseDates(key,a,b,i){document.querySelectorAll('[data-date-key="'+key+'"] [data-preset]').forEach(el=>el.classList.toggle('selected',el.dataset.preset===String(i)));if(i===6){openDateCalendar(key,a,b);return}let today=new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Shanghai'})),range=searchDateBounds(i,today);$(a).value=range[0]+' 00:00:00';$(b).value=range[1]+' 23:59:59';syncDateTrigger(key,a,b)}
let havenCalendar=null;
function calendarDate(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function openDateCalendar(key,a,b){let old=document.getElementById('havenCalendar');if(old)old.remove();let date=$(a).value?new Date($(a).value.slice(0,10)+'T12:00:00'):new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Shanghai'}));havenCalendar={key,a,b,start:$(a).value.slice(0,10),end:$(b).value.slice(0,10),startTime:$(a).value.slice(11)||'00:00:00',endTime:$(b).value.slice(11)||'23:59:59',month:new Date(date.getFullYear(),date.getMonth(),1)};let d=document.createElement('dialog');d.id='havenCalendar';d.className='haven-calendar';d.setAttribute('aria-label','选择日期范围');d.innerHTML='<div class="hc-top"><b>选择日期范围</b><button type="button" aria-label="关闭日历" onclick="closeDateCalendar()">×</button></div><div class="hc-nav"><button type="button" aria-label="上个月" onclick="shiftCalendar(-1)">‹</button><span class="hc-pill">日期</span><button type="button" aria-label="下个月" onclick="shiftCalendar(1)">›</button></div><div id="hcMonths" class="hc-months"></div><div id="hcRange" class="hc-range" aria-live="polite"></div><div class="hc-footer"><button type="button" onclick="clearCalendar()">清空日期</button><button type="button" class="hc-apply" id="hcApply" onclick="applyCalendar()">确认日期</button></div>';document.body.appendChild(d);d.addEventListener('click',e=>{if(e.target===d)closeDateCalendar()});d.querySelector('.hc-footer').insertAdjacentHTML('beforebegin',`<div class="grid" style="margin:12px 0"><label>开始时间<input type="time" step="1" id="hcStartTime" value="${havenCalendar.startTime}" oninput="havenCalendar.startTime=this.value"></label><label>结束时间<input type="time" step="1" id="hcEndTime" value="${havenCalendar.endTime}" oninput="havenCalendar.endTime=this.value"></label></div>`);d.showModal();renderCalendar()}
function closeDateCalendar(){document.getElementById('havenCalendar')?.close()}
function shiftCalendar(n){let c=havenCalendar;c.month=new Date(c.month.getFullYear(),c.month.getMonth()+n,1);renderCalendar()}
function calendarPick(value){let c=havenCalendar;if(!c.start||c.end){c.start=value;c.end=''}else if(value<c.start){c.end=c.start;c.start=value}else c.end=value;renderCalendar()}

function renderCalendar(){let c=havenCalendar;document.getElementById('hcMonths').innerHTML=[0,1].map(offset=>{let m=new Date(c.month.getFullYear(),c.month.getMonth()+offset,1),count=new Date(m.getFullYear(),m.getMonth()+1,0).getDate(),pad=(m.getDay()+6)%7;return `<section><h3>${m.getFullYear()}年 ${m.getMonth()+1}月</h3><div class="hc-grid">${['一','二','三','四','五','六','日'].map(x=>'<span class="hc-week">'+x+'</span>').join('')}${'<span></span>'.repeat(pad)}${Array.from({length:count},(_,i)=>{let value=calendarDate(new Date(m.getFullYear(),m.getMonth(),i+1)),edge=value===c.start||value===c.end,inside=c.start&&c.end&&value>c.start&&value<c.end;return `<button type="button" class="hc-day ${edge?'hc-selected':inside?'hc-between':''}" aria-label="${value}" aria-pressed="${edge?'true':'false'}" onclick="calendarPick('${value}')">${i+1}</button>`}).join('')}</div></section>`}).join('');document.getElementById('hcRange').textContent=c.start?c.start+' 至 '+(c.end||'请选择结束日期'):'请选择开始日期';document.getElementById('hcApply').disabled=!!c.start&&!c.end}

  let row={no:'TX'+String(seq++).padStart(5,'0'),exchangeNo:ref,key:'recipient-'+peer.id,account:peer.id,name:peer.name,role:peer.role||'散客',type,coin,amount,balance:peer.balances[coin],recipient:id(),remark:note,time:now()};

function exportCSV(){if(!queryHasResults){toast('当前筛选无数据可导出');return}let k='cash';let headers=['户口号','组别','姓名','角色','介绍人','开户厅','状态',...coins.map(c=>c+'(万，'+(k==='cash'?'现金余额':'余额')+')'),'未还M卡(万)','操作人','创建时间'];let values=listedAccounts().map(state=>withAccountState(state,()=>[id(),account.code,account.name,account.role,account.introducer||'无',account.hall||'1F',account.locked?'冻结':'正常',...coins.map(c=>fmt(balances[c][k])),debtText(),account.createdBy||'—',account.created||'—']));let csv='\uFEFF'+[headers,...values].map(row=>row.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='户口管理_查询结果.csv';a.click();URL.revokeObjectURL(a.href);toast('已导出当前查询结果（CSV，可用 Excel 打开）')}

function withdrawalDebts(){const result=[],acct=id(),today=now().slice(0,10);for(const m of accountDebtRecords(acct)){const amount=m.amount-(m.paid||0n);if(amount<=0n)continue;let due=m.due||'';if(!due&&m.days&&m.time){const d=new Date(m.time.slice(0,10)+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+Number(m.days));if(!isNaN(d))due=d.toISOString().slice(0,10)}result.push({type:'欠M',proposal:m.session||m.proposal||'—',marker:m.id,amount,coin:m.cur,due:due||'—',overdue:due?(due.slice(0,10)<today?'是':'否'):'—'})}const money=v=>typeof v==='bigint'?v:units(String(v||0));for(const r of account.consumptionDebts||[]){const cash=r.cashAdvance==null?(r.pointsAdvance==null?money(r.amount)-money(r.paid):0n):money(r.cashAdvance)-money(r.cashPaid),points=Number(r.pointsAdvance||0)-Number(r.pointsPaid||0);if(cash>0n)result.push({type:'现金垫付',booking:r.booking||r.bookingNo||'—',amount:cash,coin:'HKD'});if(points>0)result.push({type:'积分垫付',booking:r.booking||r.bookingNo||'—',amount:points})}const settlements=qmSettlementRows(true),pending=r=>r&&!r.doneY&&(r.parent||r.kind==='B数'),proposals=new Set(settlements.filter(r=>(r.target===acct||r.acct===acct)&&pending(r)).map(r=>r.parent||r.id));for(const proposal of proposals){const main=settlements.find(r=>r.id===proposal&&!r.parent),children=settlements.filter(r=>r.parent===proposal&&pending(r)&&(main?.target===acct||r.target===acct)),display=children.length?children:[null];for(const child of display){const source=main||child;result.push({type:'占成未交收',proposal,expectedAmount:settlements.filter(r=>(r.parent||r.id)===proposal&&r.target===acct&&pending(r)).reduce((n,r)=>n+r.payY,0n),order:child?.id||proposal,openingAccount:source.acct,share:main?.share??'—',mainAmount:pending(main)?main.payY:0n,hiddenAccount:child?.target||'—',hiddenShare:child?.share??'—',hiddenAmount:child?child.payY:null,amount:child?.target===acct?child.payY:(main&&!main.doneY?main.payY:0n),coin:source.cur,opened:source.opened||'—',closed:source.time||'—'})}}return result}
function accountUnsettledShareTable(rows){const entries=rows.filter(r=>r.type==='占成未交收'),totals=new Map(),mainSeen=new Set(),hiddenSeen=new Set(),headers=['提案ID','开工户口','占成比','占成交收金额(万)','隐藏占成户口','隐藏占成比','隐藏占成交收金额(万)','币种','开工日期','收工日期'];const signed=n=>(n>0n?'+':'')+fmt(n),ratio=n=>n==='—'?'—':String(n).replace(/%$/,'')+'%';const body=entries.map(r=>{const t=totals.get(r.coin)||{main:0n,hidden:0n};totals.set(r.coin,t);const mainKey=JSON.stringify([r.coin,r.proposal]),hiddenKey=JSON.stringify([r.coin,r.order]);if(!mainSeen.has(mainKey)){t.main+=r.mainAmount;mainSeen.add(mainKey)}if(r.hiddenAmount!==null&&r.hiddenAmount!==undefined&&!hiddenSeen.has(hiddenKey)){t.hidden+=r.hiddenAmount;hiddenSeen.add(hiddenKey)}return qmRow([r.proposal,r.openingAccount,ratio(r.share),signed(r.mainAmount),r.hiddenAccount,ratio(r.hiddenShare),r.hiddenAmount==null?'—':signed(r.hiddenAmount),r.coin,r.opened,r.closed])}).join('');const footer=[...totals].map(([cur,t])=>'<tr class="unsettled-share-total">'+['总计','—','—',signed(t.main),'—','—',signed(t.hidden),cur,'—','—'].map((v,i)=>`<td><strong>${esc(v)}</strong></td>`).join('')+'</tr>').join('');return '<h3>占成未交收</h3>'+table(headers,body).replace('</tbody>','</tbody>'+(footer?'<tfoot>'+footer+'</tfoot>':''))}
function refreshWithdrawalDebtNotice(operation='取款'){const rows=withdrawalDebts(),required=rows.length>0,notice=$(operation==='转账'?'transferDebtNotice':'withdrawDebtNotice'),remark=$('remark');if(notice){notice.hidden=false;const group=(title,headers,type,cells)=>'<h3>'+title+'</h3>'+table(headers,rows.filter(r=>r.type===type).map(r=>qmRow(cells(r))).join(''));notice.innerHTML=(required?'<strong>存在未清记录，必须填写'+operation+'备注后才能提交。</strong>':'<span>当前无未清记录。</span>')+group('当前欠M',['提案ID','欠M金额(万)','币种','到期日','是否过期'],'欠M',r=>[r.proposal,r.amount,r.coin,r.due,r.overdue])+'<h3>当前欠消费 <small style="font-weight:normal">（现金垫付默认HKD）</small></h3>'+table(['预定号','积分垫付金额（积分）'],rows.filter(r=>r.type==='积分垫付').map(r=>qmRow([r.booking,String(r.amount)])).join(''))+table(['预定号','现金垫付金额(万)'],rows.filter(r=>r.type==='现金垫付').map(r=>qmRow([r.booking,r.amount])).join(''))+accountUnsettledShareTable(rows)}if(remark){remark.required=required;remark.setAttribute('aria-required',String(required));remark.placeholder=required?'请输入'+operation+'原因（必填）':'请输入备注（选填）';const label=remark.closest('label')?.querySelector('span');if(label)label.textContent=required?'备注 *（必填）':'备注（选填）'}return rows}

function getSystemExchangeRate(from,to){let value=systemFxRates[from+'|'+to+'|mul'];if(!value||Number(value)<=0)throw Error('系统未配置该币种对汇率，请联系管理员');return value}
function fxCurrencyChanged(){let key=$('from').value+'|'+$('to').value+'|'+'mul',v=systemFxRates[key];$('fxRate').value=v||'';let hint=$('fxRateSource');if(!hint){hint=document.createElement('small');hint.id='fxRateSource';hint.className='hint';$('fxRate').parentElement.appendChild(hint)}hint.textContent=v?'系统汇率，只读不可调整':'系统未配置该币种汇率，暂不可换汇';updateFx()}

function amountFreezeModal(mode='freeze',selectedNo=''){let active=freezes.filter(f=>f.remaining>0n);modal('冻结 / 解冻 · '+id(),`<div class="form-grid">${field('币种',coinSelect('coin','freezePreview()'))}${mode==='freeze'?field('冻结金额（万） *',amountInput('amount','freezePreview()')):field('解冻金额（万）','<input id="releaseTotal" readonly>')}${field('备注（选填）','<textarea id="reason" placeholder="请输入备注（选填）"></textarea>',true)}</div><div class="preview" id="freezePreview">冻结会直接扣减现金余额；解冻恢复对应现金。</div><input type="hidden" id="freezeMode" value="${mode}">`,()=>{let a=mode==='release'?balances[$('coin').value].frozen:units($('amount').value),why=$('reason').value.trim();if(a<=0n)throw Error(mode==='release'?'该币种暂无可解冻金额':'金额必须大于零');if(mode==='freeze'){let c=$('coin').value;if(a>balances[c].cash)throw Error('现金余额不足，不能冻结');balances[c].cash-=a;balances[c].frozen+=a;freezes.unshift({no:'FZ'+String(seq++).padStart(4,'0'),coin:c,total:a,remaining:a,why,time:now(),releases:[]});log('冻结',c,-a);recordFreezeEvent('冻结',c,a,balances[c].frozen,'','',why)}else{let c=$('coin').value;if(a>balances[c].frozen)throw Error('该币种冻结余额不足');let remaining=a,stamp=now(),releaseNo='UF'+String(seq++).padStart(4,'0');for(let f of [...freezes].reverse()){if(f.coin!==c||f.remaining<=0n||remaining<=0n)continue;let used=f.remaining<remaining?f.remaining:remaining;f.remaining-=used;f.releases.push({a:used,why,time:stamp,no:releaseNo});remaining-=used}balances[c].cash+=a;balances[c].frozen-=a;log('解冻',c,a,releaseNo);recordFreezeEvent('解冻',c,a,balances[c].frozen,'','',why)}closeModal();detail();toast(mode==='freeze'?'冻结成功，现金余额已扣减':'解冻成功，现金余额已恢复')},mode==='freeze'?'确认冻结':'确认解冻');let source=freezes.find(f=>f.no===selectedNo);if(source)$('coin').value=source.coin;freezePreview()}

function freezeReport(){activeNav('冻结列表');$('pageTitle').textContent='冻结列表';$('main').innerHTML=`<div class="page-head"><div><h2>冻结列表</h2><p class="muted">查询额度冻结及户口停用启用记录</p></div></div><div class="toolbar"><button class="${freezeReportTab==='amount'?'primary':''}" onclick="switchFreezeReport('amount')">额度冻结详情</button><button class="${freezeReportTab==='account'?'primary':''}" onclick="switchFreezeReport('account')">户口冻结详情</button></div><div class="card" style="padding:14px"><div class="freeze-filters"><label>搜索户口<input id="fr-search" placeholder="户口号/姓名" value="${esc(freezeQuery.q)}" onkeydown="if(event.key==='Enter')queryFreezeReport()"></label><label>操作类型<select id="fr-type">${opt(['全部',...(freezeReportTab==='amount'?['冻结','解冻']:['冻结账户','解冻账户'])],freezeQuery.type)}</select></label>${dateSearch('fr','fr-start','fr-end',freezeQuery.start,freezeQuery.end,'queryFreezeReport()','resetFreezeReport()')}<button onclick="exportFreezeReport()">汇出</button></div><p id="fr-error" class="danger" role="alert"></p></div><div id="fr-table"></div>`;renderFreezeRows();window.scrollTo(0,0)}

function qmDue(days){let d=new Date();d.setDate(d.getDate()+days);return d.toLocaleDateString('sv-SE')}
function qmSessionCreditUsed(c){return ($('sessionFrame')?.contentWindow?.sessionBridge?.markerRecords?.()||[]).filter(m=>m.credit===c.id&&m.session).reduce((n,m)=>n+m.amount-m.paid,0n)}
function qmAvailable(c){return c.revoked||c.expires&&c.expires<now().slice(0,10)?0n:c.amount-c.used-c.granted-qmSessionCreditUsed(c)}
function availableMarkerCredits(acct,cur){return qmCredits.filter(c=>c.acct===acct&&!c.revoked&&(!c.expires||c.expires>=now().slice(0,10))&&(!c.cur||c.cur===cur)).map(c=>({id:c.id,type:qmCreditType(c),cur:c.cur||'',amount:c.amount,used:c.used+c.granted+qmSessionCreditUsed(c),available:qmAvailable(c),expires:c.expires||''}))}
function qmFinish(){closeModal();quotaPage(qmPage);toast('演示记录已更新')}
function qmRecordId(prefix){return prefix+'-'+Date.now()+'-'+qmSequence++}
function qmCell(v){return `<td>${typeof v==='bigint'?fmt(v):esc(v)}</td>`}
function qmRow(values,action=''){return '<tr>'+values.map(qmCell).join('')+(action?'<td>'+action+'</td>':'')+'</tr>'}
function qmAction(label,code){return `<button type="button" onclick="${code}">${label}</button>`}
function qmAudit(c,text){if(c.initialAmount===undefined&&text.startsWith('新增'))c.initialAmount=c.amount;c.history.unshift({time:now(),text})}
function qmFilters(){if(qmPage===1)return qmCreditFilters();if(qmPage===4)return qmSettlementFilters();if(qmPage===3)return qmNegativeFilters();if(qmPage===2)return qmMarkerFilters();let f=qmFilter;return `<div class="card body qm-filters">${qmInput('qm-q','户口号 / 姓名','search',f.q||'')}${qmSelect('qm-cur','币种',['全部',...coins],f.cur||'全部')}${qmSelect('qm-status','状态',qmPage===1?['全部','有效','已过期','已收回']:qmPage===2?['全部','未还','部分还款','已还清']:qmPage===4?['全部','未结算','部分结算','已结算']:['全部'],f.status||'全部')}${qmSelect('qm-kind','类型',qmPage===0?['全部','入股','退股','退股还M']:qmPage===1?['全部','公司批额','股本批额','授予批额']:qmPage===4?['全部','A数','B数','隐藏占成']:['全部'],f.kind||'全部')}${qmPage===1?qmSelect('qm-source-filter','批额来源',['全部','原始','授予'],f.source||'全部')+qmSelect('qm-timed','限时状态',['全部','永久','限时','已过期'],f.timed||'全部'):''}${qmPage===2?qmSelect('qm-due-filter','到期状态',['全部','未到期','已过期'],f.due||'全部'):''}${qmPage===4?qmInput('qm-target','结算户口','search',f.target||''):''}${qmDateFilters()}<div class="qm-actions">${qmAction('导出 CSV','qmExport()')}</div><div id="qm-filter-error" role="alert"></div></div>`}
function qmSearch(){if(qmPage===4){qmFilter=Object.fromEntries(['q','cur','yStatus','cStatus','start','end'].map(k=>[k,qmValue(k)]));if(qmFilter.start&&qmFilter.end&&qmFilter.start>qmFilter.end){$('qm-filter-error').textContent='开始时间不能晚于结束时间';return}quotaPage(4);return}if(qmPage===2)return qmMarkerSearch();qmFilter=Object.fromEntries(['q','cur','status','kind','start','end'].map(k=>[k,qmValue(k)]));Object.assign(qmFilter,{timed:qmValue('timed'),due:qmValue('due-filter'),target:qmValue('target')});if(qmFilter.start&&qmFilter.end&&qmFilter.start>qmFilter.end){$('qm-filter-error').textContent='开始时间不能晚于结束时间';return}quotaPage(qmPage)}
function qmRange(n){$('qm-start').value=qmDue(-n)+'T00:00:00';$('qm-end').value=now().replace(' ','T');qmSearch()}
function qmStatus(r){if(qmPage===1)return r.revoked?'已收回':r.expires&&r.expires<now().slice(0,10)?'已过期':'有效';if(qmPage===2)return r.paid===r.amount?'已还清':r.paid?'部分还款':'未还';if(qmPage===4)return r.doneY&&r.doneC?'已结算':r.doneY||r.doneC?'部分结算':'未结算';return '全部'}
function qmRows(){if(qmPage===4)return qmSettlementRows();if(qmPage===2)return qmMarkerRows();let rows=[qmShares,qmCredits,qmMarkers,qmNegatives,qmSettlements][qmPage],f=qmFilter;return rows.filter(r=>{let time=(r.time||r.date+' 00:00:00').replace(' ','T');return (!f.q||[r.acct,qmPerson(r.acct)?.name,r.target].some(v=>(v||'').toLowerCase().includes(f.q.toLowerCase())))&&(!f.cur||f.cur==='全部'||r.cur===f.cur)&&(!f.kind||f.kind==='全部'||(qmPage===1?qmCreditType(r):r.kind)===f.kind)&&(!f.status||f.status==='全部'||qmStatus(r)===f.status)&&(!f.timed||f.timed==='全部'||(f.timed==='已过期'?!!r.expires&&r.expires<now().slice(0,10):f.timed==='限时'?!!r.expires:!r.expires))&&(!f.due||f.due==='全部'||(f.due==='已过期'?r.due<now().slice(0,10):r.due>=now().slice(0,10)))&&(!f.target||(r.target||'').includes(f.target))&&inDateRange(time,f.start,f.end)})}
function quotaPage(page){if(page!==qmPage){qmFilter=page===4?{}:page===2?{repayment:'未还清'}:{};qmSelected.clear()}qmPage=page;if(typeof leaveSessions==='function')leaveSessions();let name=qmNames[page];if(typeof workspaceTabActions!=='undefined')workspaceTabActions[name]=()=>quotaPage(page);activeNav(name);$('pageTitle').textContent=name;let labels=['新增入退股','新增批额','','新增负数资格',''];$('main').innerHTML=`<div class="qm-page ${page===1?'qm-credit-page':page===3?'qm-negative-page':page===2?'qm-marker-page':page===4?'qm-settlement-page':''}"><div class="page-head"><div><h2>${name}</h2><p class="muted">${['支持入股、退股、退股还M，记录入退股历史','原始批额可授予下线，最多一层；到期后不计入可用额度','查看借款、尚欠及还款记录','新增、移除均保留操作记录','已收工订单及关联占成子订单，上下数与码粮分别结算'][page]}</p></div><div class="qm-actions">${page===1?qmAction('批额汇总','qmCreditSummary()')+qmAction('授予批额','qmGrant()'):''}${labels[page]?`<button class="primary" onclick="qmOpen(${page})">＋ ${labels[page]}</button>`:''}</div></div>${qmFilters()}${page===4?qmSettlementPanel():''}<div class="card" id="qm-results"></div></div>`;qmRender()}
function qmRender(){if(qmPage===4)return qmSettlementRender();if(qmPage===2)return qmMarkerRender();let rows=qmRows(),headers=[['日期','时间','单号','户口号','姓名','类型','批额(万)','股价(万)','股数','变动金额(万)','开户厅','操作厅','币种','支付方式','操作人','备注','操作'],['单号','户口号','姓名','开户厅','操作厅','币种','批额类型','授予方','批额(万)','已签额(万)','已授予(万)','可用额(万)','限时','有效期至','剩余/过期','状态','操作人','操作时间','操作'],['单号','户口','姓名','币种','借款(万)','尚欠(万)','签M日期','到期日期','已签天数','过期天数','利率(%/天)','状态','操作'],['户口号','姓名','操作类型','备注','操作时间','操作人','操作'],['<input type="checkbox" aria-label="全选当前筛选结果" onchange="qmSelectAll(this.checked)">','场次号','类型','币种','收工时间','开工户口','户名','结算户口','本金(万)','上下数(万)','转码(万)','码粮(万)','占成','上下数交收(万)','码粮交收(万)','合计(万)','状态','操作']][qmPage];let html=rows.map(r=>{let a=qmPerson(r.acct),idx=[qmShares,qmCredits,qmMarkers,qmNegatives,qmSettlements][qmPage].indexOf(r);if(qmPage===0)return qmRow([r.time.slice(0,10),r.time.slice(11),r.id,r.acct,a?.name||'—',r.kind,'—',r.price||0n,String(r.shares||0n),r.amount,a?.hall||'—',r.hall||'—',r.cur,r.method,'admin',r.note,'—']);if(qmPage===1)return qmRow([r.id,r.acct,a?.name,a?.hall||'—',r.hall||'—',r.cur,qmCreditType(r),qmCredits.find(c=>c.id===r.parent)?.acct||'—',r.amount,r.used,r.granted,qmAvailable(r),r.expires?'限时':'永久',r.expires||'—',qmExpiryText(r.expires),qmStatus(r),'admin',r.time],qmAction('编辑',`qmCredit(${idx})`)+qmAction('纪录',`qmHistory(1,${idx})`)+(r.parent&&!r.revoked?qmAction('收回',`qmRevoke(${idx})`):''));if(qmPage===3)return qmRow([r.acct,a?.name,r.kind,r.note,r.time,r.operator||'admin'],qmAction('操作记录',`qmNegativeHistory(${idx})`)+(qmNegatives.find(x=>x.acct===r.acct)===r&&r.kind!=='移除'?qmAction('移除',`qmRemoveNegative('${r.acct}')`):''));return '<tr><td><input type="checkbox" aria-label="选择'+esc(r.session)+'" '+(qmSelected.has(r.id)?'checked':'')+' onchange="this.checked?qmSelected.add(\''+r.id+'\'):qmSelected.delete(\''+r.id+'\')"></td>'+[r.session,r.kind,r.cur,r.time,r.acct,a?.name||'—',r.target,r.principal,r.y,r.roll,r.commission,r.share,r.payY,r.payC,r.payY+r.payC,qmStatus(r)].map(qmCell).join('')+'<td>'+qmAction('详情',`qmSettlementDetail(${idx})`)+'</td></tr>'}).join('');$('qm-results').innerHTML=table(headers,html)}
function qmOpen(p){if(p===0)qmShare();if(p===1)qmCredit();if(p===3)qmNegative()}
function qmNote(){return qmInput('qm-note','备注（选填）')}
function qmCredit(index=-1){if(index<0)return qmCreditCreate();let c=qmCredits[index];modal(c?'编辑批额':'新增批额',`<div class="qm-form">${qmAccount('qm-acct','户口',c?.acct)}${c?.cur?qmSelect('qm-coin','币种',coins,c.cur):'<input type="hidden" id="qm-coin" value="">'}${qmSelect('qm-type','批额类型',['公司批额','股本批额'],c?.kind||'公司批额')}${qmInput('qm-amount','批额金额(万)','number',c?fmt(c.amount):'','min="0" step="0.0001"')}${qmInput('qm-expiry','有效期至（留空为永久）','date',c?.expires||'')}${qmNote()}</div>`,()=>{let acct=qmNeedAccount(),amount=qmAmount('amount'),expires=qmValue('expiry');if(amount<=0n)throw Error('批额金额须大于0');if(expires&&expires<now().slice(0,10))throw Error('有效期不能早于今天');if(c&&(amount!==c.amount||qmValue('type')!==c.kind))throw Error('提案生成后不可编辑金额或批额类型');if(c&&(c.used+c.granted>amount))throw Error('批额不可小于已签额与已授予合计');if(c&&(acct!==c.acct||qmValue('coin')!==c.cur))throw Error('编辑不能变更户口或币种');if(c?.parent||c?.revoked)throw Error('授予或收回批额不能编辑');let r=c||{id:qmRecordId('CR'),used:0n,granted:0n,parent:'',history:[]};Object.assign(r,{acct,cur:qmValue('coin'),amount,expires,kind:qmValue('type'),time:c?.time||now()});qmAudit(r,(c?'修改':'新增')+'批额 '+fmt(amount)+'；'+qmValue('note'));if(!c)qmCredits.unshift(r);qmFinish()});if(c){$('qm-acct').disabled=true;$('qm-coin').disabled=true;$('qm-type').disabled=true;$('qm-amount').readOnly=true;$('qm-amount').insertAdjacentHTML('afterend','<small class="hint">提案生成后不可编辑金额</small>')}}
function qmGrant(){modal('授予批额（仅一层）',`<p class="notice">被授予方可签M，不能再次下放。股本批额沿用入股币种，公司批额不区分币种；提交即时生效，无需审核。</p><div class="qm-form">${qmAccount('qm-grantor','授予方户口')}<div id="qm-grantor-name" class="hint">请检索授予方户口</div><input id="qm-parent" type="hidden"><div id="qm-grant-options" class="span2"></div>${qmAccount('qm-acct','被授予户口')}${qmInput('qm-amount','授予金额(万)','number','','min="0" step="0.0001"')}${qmNote()}</div>`,()=>{let c=qmCredits.find(c=>c.id===qmValue('parent')),acct=qmNeedAccount(),amount=qmAmount('amount');if(!c||c.acct!==qmValue('grantor')||!qmPerson(qmValue('grantor'))||c.parent||amount<=0n||amount>qmAvailable(c))throw Error('授予金额须大于0且不超过父批额可用额');if(acct===c.acct)throw Error('不能授予同一户口');c.granted+=amount;qmAudit(c,'授予 '+acct+' '+fmt(amount));qmCredits.unshift({id:qmRecordId('CR'),acct,cur:c.cur,kind:c.kind,parent:c.id,amount,initialAmount:amount,used:0n,granted:0n,expires:c.expires,time:now(),history:[{time:now(),text:'来自 '+c.acct}]});qmFinish()});$('qm-grantor').addEventListener('input',qmGrantLookup);$('qm-grantor').addEventListener('change',qmGrantLookup);qmGrantLookup()}
function qmRevoke(index){let c=qmCredits[index];modal('收回授予批额',`<p>${esc(c.acct)} · ${c.cur} · ${fmt(c.amount)} 万</p><p>已签M尚未还清时不允许收回。</p>`,()=>{if(c.revoked||c.used>0n)throw Error('已收回或仍有已签额，不能收回');let p=qmCredits.find(x=>x.id===c.parent);if(!p)throw Error('父批额不存在');p.granted-=c.amount;c.originalAmount=c.amount;c.amount=0n;c.revoked=true;qmAudit(c,'批额已收回');qmAudit(p,'收回 '+c.acct+' '+fmt(c.originalAmount));qmFinish()},'确认收回')}
function qmRepay(index){qmRepayDialog([qmMarkers[index]])}
function qmHistory(page,index){if(page===2)return qmRepayHistory(index);let r=[null,qmCredits,qmMarkers][page][index];modal('操作纪录 · '+r.id,table(['操作','操作人','时间','变更内容'],r.history.map(h=>qmRow([h.text.includes('新增')?'新增':'变更','admin',h.time,h.text])).join('')),null)}

function qmNegative(){modal('新增负数资格',`<div class="qm-form">${qmAccount('qm-acct','选择户口')}${qmNote()}</div>`,()=>{let a=qmNeedAccount(),latest=qmNegatives.find(x=>x.acct===a);if(latest&&latest.kind!=='移除')throw Error('该户口已有负数资格');qmNegatives.unshift({id:qmRecordId('NG'),acct:a,kind:'新增',note:qmValue('note'),time:now(),operator:'admin'});qmFinish()})}

function qmRemoveNegative(acct){modal('移除负数资格',`<p>移除 ${esc(acct)} 的负数资格，保留全部历史。</p>`,()=>{qmNegatives.unshift({id:qmRecordId('NG'),acct,kind:'移除',note:'移除负数资格',time:now()});qmFinish()},'确认移除')}
let qmShareMarkers=new Set();
function qmShare(){qmShareMarkers.clear();modal('新增入退股',`<div class="qm-share-form"><div><span class="qm-share-label">操作类型 *</span><input id="qm-type" type="hidden" value="入股"><div class="qm-share-radios">${['入股','退股','退股还M'].map((v,i)=>`<label><input type="radio" name="qm-share-kind" value="${v}" ${i===0?'checked':''} onchange="$('qm-type').value=this.value;qmShareMarkers.clear();qmShareUpdate()">${v}</label>`).join('')}</div></div><div class="qm-share-search"><label for="qm-acct">选择股东户口 *</label><input id="qm-acct" value="${esc(id())}" placeholder="输入户口号或姓名搜索" autocomplete="off"><div id="qm-share-results" class="qm-account-results" hidden></div><small id="qm-share-person"></small></div>${qmSelect('qm-coin','币种 *',coins,'HKD')}<div id="qm-share-holdings" class="hint"></div><div class="qm-share-numbers">${qmInput('qm-shares','股数 *','number','','min="1" step="1"')}${qmInput('qm-price','每股价格（万）*','number','','min="0" step="0.0001"')}</div><small id="qm-share-price-hint" hidden>退股股价沿用入股股价，不可修改。</small><div id="qm-total" class="qm-share-total">入股金额：0.0000 万</div><div id="qm-share-payment"><span class="qm-share-label">支付方式 *</span><input id="qm-method" type="hidden" value="存款"><div class="qm-share-radios">${['现金','存款'].map(v=>`<label><input type="radio" name="qm-share-method" value="${v}" ${v==='存款'?'checked':''} onchange="$('qm-method').value=this.value;qmShareUpdate()">${v}</label>`).join('')}</div><div id="qm-share-payer">${qmAccount('qm-payer','付款 / 退款户口',id())}</div></div><div id="qm-share-marker" hidden><b>未还清M单（勾选后用于退股还款）*</b><div id="qm-marker"></div><p id="qm-share-repay-summary" class="hint"></p></div>${passwordFields('actionPwd')}${qmNote()}<div id="qm-share-repay-note-wrap" hidden>${qmInput('qm-repay-note','还M备注','text','','maxlength="128" placeholder="选填"')}</div></div><p class="hint">退股金额不得超过持有股本及可释放批额；退股还M按勾选列表顺序分配，支持部分还款。</p>`,()=>{let acct=qmNeedAccount(),kind=qmValue('type'),cur=qmValue('coin'),n=qmValue('shares');if(!/^\d+$/.test(n)||BigInt(n)<=0n)thro function qmCommissionPlan(mode,customer,company,agents,total,advanceAgent){
 if(!['公司全额垫付','代理全额垫付','各自支付'].includes(mode))throw Error('请选择支付方式');
 if(typeof total!=='bigint'||total<=0n)throw Error('客户码粮必须大于0');
 if(!customer||!company||customer===company)throw Error('付款与收款户口不能相同');
 const merged=new Map();for(const a of agents){if(!a.acct||a.acct===customer||a.acct===company||typeof a.amount!=='bigint'||a.amount<0n)throw Error('代理户口或承担金额无效');merged.set(a.acct,(merged.get(a.acct)||0n)+a.amount)}
 const share=[...merged].map(([acct,amount])=>({acct,amount})),agentTotal=share.reduce((n,a)=>n+a.amount,0n),companyAmount=total-agentTotal;
 if(companyAmount<0n)throw Error('代理承担合计不能超过客户应得码粮');
 let steps=[];const add=(from,to,amount,note)=>{if(amount>0n)steps.push({from,to,amount,note})};
 if(mode==='公司全额垫付'){add(company,customer,total,'公司先付全额码粮');for(const a of share)add(a.acct,company,a.amount,'代理归还承担部分')}
 else if(mode==='代理全额垫付'){if(!merged.has(advanceAgent))throw Error('请选择垫付代理');add(advanceAgent,customer,total,'代理先付全额码粮');add(company,advanceAgent,companyAmount,'公司归还承担部分');for(const a of share)if(a.acct!==advanceAgent)add(a.acct,advanceAgent,a.amount,'其他代理归还承担部分')}
 else{add(company,customer,companyAmount,'公司支付承担部分');for(const a of share)add(a.acct,customer,a.amount,'代理支付承担部分')}
 const net=new Map();for(const s of steps){net.set(s.from,(net.get(s.from)||0n)-s.amount);net.set(s.to,(net.get(s.to)||0n)+s.amount)}
 return {mode,total,companyAmount,agentTotal,agents:share,steps,net:[...net].map(([acct,amount])=>({acct,amount}))};
}
const qmCommissionPayments=new Map(),qmCommissionMovements=new Map();
function qmPostCommission(root,cur,plan,rowIds){
 if(qmCommissionPayments.has(root)||rowIds.some(id=>qmSettlementState[id]?.doneC))throw Error('该场次码粮已交收，请勿重复支付');
 if(rowIds.some(id=>!qmSettlementState[id]))throw Error('结算订单已变化，请刷新后重试');
 const changes=plan.net.map(x=>({key:cur+'|'+x.acct,amount:x.amount}));
 const record={root,cur,mode:plan.mode,steps:plan.steps.map(x=>({...x})),net:plan.net.map(x=>({...x})),total:plan.total,time:now()};
 for(const x of changes)qmCommissionMovements.set(x.key,(qmCommissionMovements.get(x.key)||0n)+x.amount);
 qmCommissionPayments.set(root,record);
 for(const id of rowIds){qmSettlementState[id].doneC=true;qmSettlementState[id].payment=plan.mode}
 return record;
}
function qmCommissionPlanHtml(plan,cur){return `<p class="hint">币种：${esc(cur)} · 单位：万</p>${table(['步骤','从','到','金额(万)','说明'],plan.steps.map((x,i)=>qmRow([i+1,x.from,x.to,x.amount,x.note])).join(''))}<h3>完成后资金变动</h3>${table(['户口','净变动(万)'],plan.net.map(x=>`<tr><td>${esc(x.acct)}</td><td>${qmSettlementMoney(x.amount)}</td></tr>`).join(''))}`}

 const grouped=new Map();

 const name=qmPerson(c.acct)?.name||'—';if(qmSummaryQuery&&!(c.acct+' '+name).toLowerCase().includes(qmSummaryQuery.toLowerCase()))continue;
 const cur=c.kind==='公司批额'?'':c.cur,key=c.acct+'|'+cur;
 if(!grouped.has(key))grouped.set(key,{acct:c.acct,name,cur,stock:0n,company:0n,grantStock:0n,grantCompany:0n,available:0n});
 const row=grouped.get(key),kind=c.kind==='公司批额'?(c.parent?'grantCompany':'company'):(c.parent?'grantStock':'stock');row[kind]+=c.amount;row.available+=qmAvailable(c);
 }

}

function openSessions(action='list',value=''){if($('modal').open)closeModal();document.body.classList.add('session-mode');window.scrollTo(0,0);document.querySelector('.layout')?.scrollTo?.(0,0);activeNav(action==='settings'?'码粮占成设置':'开工管理');$('pageTitle').textContent=action==='open'?'新开工':action==='settings'?'码粮占成设置':'开工管理';if(!sessionReady){sessionPending={action,value};return}if(action==='list')$('sessionFrame').contentWindow.sessionBridge.showList();else $('sessionFrame').contentWindow.sessionBridge.navigate(action,value);syncSessionAccount()}
function startAccountSession(){if(!allowAccountOperation())return;openSessions('open',id())}
function leaveSessions(){document.body.classList.remove('session-mode')}
function accountSessionTable(){let rows=sessionReady?$('sessionFrame').contentWindow.sessionBridge.records(id()):[];return table(['场次号','类型','币种','本金(万)','转码(万)','状态','开工时间','操作'],rows.map(s=>`<tr><td>${esc(s.id)}</td><td>${esc(s.type)}</td><td>${s.cur}</td><td>${fmt(s.initial)}</td><td>${fmt(s.roll)}</td><td>${esc(s.status)}</td><td>${esc(s.opened)}</td><td><button class="link" onclick="openSessions('detail','${esc(s.id)}')">查看</button></td></tr>`).join(''))}
function sessionAccountChanged(a){if(a.id!==id())return;for(let c of coins){let cashDelta=(a.cash?.[c]??balances[c].cash)-balances[c].cash;if(cashDelta!==0n){balances[c].cash+=cashDelta;log(cashDelta<0n?'取款':'存款',c,cashDelta,'',a.operation+' · '+a.session+'（现金余额）')}let available=creditInfo(c)?.available||0n;sessionCreditUse[c]=(sessionCreditUse[c]||0n)+available-a.credit[c];let delta=a.stored[c]-balances[c].stored;if(delta!==0n&&['开工','加彩','收工','暂存','恢复开工'].includes(a.operation)){txnHistory.unshift({no:'TX'+String(seq++).padStart(5,'0'),key:freezeAccountKey,account:id(),name:account.name,role:account.role,type:a.operation==='恢复开工'?'恢复开工取余额':a.operation==='暂存'?'暂存余额':a.operation==='加彩'?'加彩余额':a.operation==='开工'?'余额开工':'收工余额',coin:c,amount:delta,balance:a.stored[c],recipient:'',remark:a.operation+' · '+a.session+'（余额余额）',time:now()})}balances[c].stored=a.stored[c]}audit.unshift({type:'开工管理联动',text:a.session,time:now()})}
const baseCreditInfo=creditInfo;
creditInfo=function(c){let b=baseCreditInfo(c);if(!b)return null;let used=sessionCreditUse[c]||0n;return {...b,debt:b.debt+used,available:b.available-used}};
const baseAccountSave=saveAccount;
saveAccount=function(fresh){let old=account;let previous=id();accountSaveInProgress=true;try{baseAccountSave(fresh)}finally{accountSaveInProgress=false}if(old!==account){if(fresh){sessionIdentity=id();sessionCreditUse={}}else sessionIdentity=previous;syncSessionAccount();baseAccountDetail()}};
const baseAccountDetail=detail;
detail=function(){leaveSessions();if(!accountSaveInProgress)syncSessionAccount();baseAccountDetail()};
const baseAccountList=showList;
showList=function(){leaveSessions();baseAccountList()};
const baseAccountForm=accountForm;
accountForm=function(fresh){leaveSessions();baseAccountForm(fresh)};
const baseFreezeReport=freezeReport;
freezeReport=function(){leaveSessions();baseFreezeReport()};
const baseMenu=menu;
menu=function(n){if(n==='开工管理')return openSessions('list');if(n==='码粮占成设置')return openSessions('settings');if(n==='户口管理')return showList();if(n==='冻结列表')return freezeReport();if(n==='操作日志')leaveSessions();return baseMenu(n)};
const workspaceTabActions={'开工管理':()=>openSessions('list'),'新开工':()=>openSessions('open'),'户口管理':()=>showList(),'户口详情':()=>detail(),'冻结列表':()=>freezeReport(),'中转户':()=>transitPage(),'系统设置':()=>settingsPage()};
let workspaceTabs=['开工管理','新开工','户口管理','户口详情','冻结列表'],workspaceActive='户口管理';
function renderWorkspaceTabs(){const bar=document.querySelector('.layout > .tabs');if(!bar)return;bar.innerHTML='<div class="workspace-tab-list">'+workspaceTabs.map(name=>`<span class="workspace-tab ${workspaceActive===name?'is-current':''}"><button class="tab-main ${workspaceActive===name?'selected':''}" onclick="workspaceTabActions[decodeURIComponent('${encodeURIComponent(name).replaceAll("'",'%27')}')]()">${esc(name)}</button><button class="tab-close" aria-label="关闭${esc(name)}" title="关闭${esc(name)}" onclick="closeWorkspaceTab(decodeURIComponent('${encodeURIComponent(name).replaceAll("'",'%27')}'))">×</button></span>`).join('')+'</div><button class="workspace-close-all" onclick="closeAllWorkspaceTabs()" '+(workspaceTabs.length?'':'disabled')+'>关闭全部分页</button>'}
function closeAllWorkspaceTabs(){workspaceTabs=[];workspaceActive='';if($('modal').open)closeModal();leaveSessions();$('pageTitle').textContent='工作台';$('main').innerHTML='<div class="card body"><p>所有分页已关闭，请从左侧菜单打开页面。</p></div>';document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));renderWorkspaceTabs()}
function selectWorkspaceTab(name){if(!workspaceTabActions[name]){workspaceActive='';renderWorkspaceTabs();return}if(!workspaceTabs.includes(name))workspaceTabs.push(name);workspaceActive=name;renderWorkspaceTabs()}
function closeWorkspaceTab(name){const index=workspaceTabs.indexOf(name);if(index<0)return;const current=workspaceActive===name;workspaceTabs.splice(index,1);if(current){const next=workspaceTabs[Math.min(index,workspaceTabs.length-1)];if(next){workspaceTabActions[next]();return}workspaceActive='';leaveSessions();$('pageTitle').textContent='工作台';$('main').innerHTML='<div class="card body"><p>所有页签已关闭，请从左侧菜单打开页面。</p></div>';document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'))}renderWorkspaceTabs()}
const tabBaseActiveNav=activeNav;
activeNav=function(name){tabBaseActiveNav(name);selectWorkspaceTab(document.body.classList.contains('session-mode')?($('pageTitle').textContent==='新开工'?'新开工':'开工管理'):name)};
const tabBaseSessionTitle=sessionTitleChanged;
sessionTitleChanged=function(name,sessionId){tabBaseSessionTitle(name);if(!document.body.classList.contains('session-mode'))return;if(name==='场次详情'&&sessionId){let tab='开工详情 · '+sessionId;workspaceTabActions[tab]=()=>openSessions('detail',sessionId);selectWorkspaceTab(tab)}else selectWorkspaceTab(name==='新开工'?'新开工':'开工管理')};
const tabBaseOpenSessions=openSessions;
openSessions=function(action='list',value=''){tabBaseOpenSessions(action,value);if(action!=='detail')selectWorkspaceTab(action==='open'?'新开工':'开工管理')};

function openSessionDetailTab(sessionId){let name='开工详情 · '+sessionId;workspaceTabActions[name]=()=>openSessions('detail',sessionId);if(!workspaceTabs.includes('开工管理'))workspaceTabs.unshift('开工管理');selectWorkspaceTab(name);$('pageTitle').textContent='开工详情';document.querySelector('.workspace-tab.is-current')?.scrollIntoView?.({block:'nearest',inline:'nearest'})}

const prototypeStorageKey='cashier-prototype-state-v1';

function encodePrototypeState(value){return JSON.stringify(value,(key,v)=>typeof v==='bigint'?{$cashierBigInt:String(v)}:v instanceof Map?{$cashierMap:[...v]}:v)}
function decodePrototypeState(text){return JSON.parse(text,(key,v)=>v&&typeof v==='object'&&Object.keys(v).length===1?(typeof v.$cashierBigInt==='string'?BigInt(v.$cashierBigInt):Array.isArray(v.$cashierMap)?new Map(v.$cashierMap):v):v)}
function prototypeStorageError(message){let box=document.getElementById('prototype-storage-error');if(!box){box=document.createElement('div');box.id='prototype-storage-error';box.setAttribute('role','alert');box.style.cssText='position:fixed;bottom:16px;left:240px;right:24px;z-index:10000;padding:12px;background:#fff0df;color:#8a3c0b;border:1px solid #eab875;border-radius:8px';document.body.append(box)}box.textContent=message}

 if(Array.isArray(s.companyShares))companyShares.splice(0,companyShares.length,...s.companyShares);
 if(Array.isArray(s.companyMarker))companyMarker.splice(0,companyMarker.length,...s.companyMarker);

function loadPrototypeState(){try{const raw=localStorage.getItem(prototypeStorageKey);if(!raw)return;const saved=decodePrototypeState(raw);if(saved.version!==1||!saved.parent||!(saved.parent.accountRegistry instanceof Map)||!saved.parent.accountRegistry.has(saved.parent.activeAccount)||!Array.isArray(saved.child?.plans))throw Error('Invalid saved data');prototypeSavedState=saved;restorePrototypeParent(saved.parent)}catch(e){prototypeStorageBlocked=true;prototypeStorageError('无法读取浏览器测试数据，原保存内容未覆盖。请保留此页面并检查浏览器存储权限。')}}
function savePrototypeState(){if(prototypeStorageBlocked)return;try{const child=$('sessionFrame')?.contentWindow?.sessionBridge?.persistentSnapshot?.()||prototypeSavedState?.child;if(!child)return;const data={version:1,parent:snapshotPrototypeParent(),child};const raw=encodePrototypeState(data);if(raw===prototypeLastSaved)return;localStorage.setItem(prototypeStorageKey,raw);prototypeLastSaved=raw;prototypeSavedState=data;document.getElementById('prototype-storage-error')?.remove()}catch(e){prototypeStorageError('测试数据保存失败：浏览器存储不可用或空间不足。请勿刷新或关闭页面，先处理存储问题。')}}

// Normalize account identifiers before lookup and save; leave names/passwords unchanged.
(function(){
 const explicit=new Set(['aCode','aNum','aOldId','newCode','newNum','filterGroup','addSearch','oAcct','transit-query']);
 function isAccountIdentifier(input){
  if(!input||input.tagName!=='INPUT'||!['text','search',''].includes(input.type)||input.readOnly||input.disabled)return false;
  if(explicit.has(input.id)||/^hAcct\d+$/.test(input.id))return true;
  const label=document.querySelector('label[for="'+input.id+'"]')||input.closest('label');
  const text=[input.placeholder,input.getAttribute('aria-label'),label?.textContent].join(' ');
  return /户口|账户|戶口|帳戶|组别代码|組別代碼/.test(text)&&!/密码|密碼/.test(text)&&(!/户口名|户名|戶口名|戶名/.test(text)||/户口号|戶口號|账号|帳號/.test(text));
 }
 function normalize(input){if(!isAccountIdentifier(input))return;input.autocapitalize='characters';const value=input.value.replace(/[a-z]/g,c=>c.toUpperCase());if(value===input.value)return;const start=input.selectionStart,end=input.selectionEnd;input.value=value;if(start!==null)input.setSelectionRange(start,end)}

 if(typeof MutationObserver!=='undefined'){let pending=false;new MutationObserver(()=>{if(!pending){pending=true;queueMicrotask(()=>{pending=false;document.querySelectorAll('input').forEach(normalize)})}}).observe(document.body,{childList:true,subtree:true})}

})();
