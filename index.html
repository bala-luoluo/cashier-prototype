function dateSearch(key,startId,endId,start='',end='',search='',reset=''){return `<div class="date-search" data-date-key="${key}"><span class="date-search-label">时间</span><div class="date-shortcuts">${['今天','昨天','本周','上周','本月','上月','自定义'].map((t,i)=>`<button type="button" data-preset="${i}" class="${i===6&&(start||end)?'selected':''}" onclick="chooseDates('${key}','${startId}','${endId}',${i})">${t}</button>`).join('')}</div><input type="hidden" id="${startId}" value="${start.slice(0,10)}"><input type="hidden" id="${endId}" value="${end.slice(0,10)}"><button type="button" class="date-range-trigger" aria-haspopup="dialog" onclick="openDateCalendar('${key}','${startId}','${endId}')"><span aria-hidden="true">▦</span><span id="date-label-${key}">${start.slice(0,10)||'开始日期'}　至　${end.slice(0,10)||'结束日期'}</span></button><button class="date-search-submit" onclick="${search}">⌕ 搜索</button><button class="date-search-reset" onclick="${reset}">↻ 重置</button></div>`}
function dateCustom(key){document.querySelectorAll('[data-date-key="'+key+'"] [data-preset]').forEach(b=>b.classList.toggle('selected',b.dataset.preset==='6'))}
function searchDateBounds(i,today){let start=new Date(today.getFullYear(),today.getMonth(),today.getDate()),end=new Date(start);if(i===1){start.setDate(start.getDate()-1);end=new Date(start)}if(i===2||i===3){let offset=(start.getDay()+6)%7;start.setDate(start.getDate()-offset-(i===3?7:0));if(i===3){end=new Date(start);end.setDate(end.getDate()+6)}}if(i===4)start.setDate(1);if(i===5){start=new Date(start.getFullYear(),start.getMonth()-1,1);end=new Date(start.getFullYear(),start.getMonth()+1,0)}let fmt=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');return [fmt(start),fmt(end)]}
function chooseDates(key,a,b,i){document.querySelectorAll('[data-date-key="'+key+'"] [data-preset]').forEach(el=>el.classList.toggle('selected',el.dataset.preset===String(i)));if(i===6){openDateCalendar(key,a,b);return}let today=new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Shanghai'})),range=searchDateBounds(i,today);$(a).value=range[0];$(b).value=range[1];syncDateTrigger(key,a,b)}
let havenCalendar=null;
function calendarDate(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function openDateCalendar(key,a,b){let old=document.getElementById('havenCalendar');if(old)old.remove();let date=$(a).value?new Date($(a).value+'T12:00:00'):new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Shanghai'}));havenCalendar={key,a,b,start:$(a).value,end:$(b).value,month:new Date(date.getFullYear(),date.getMonth(),1)};let d=document.createElement('dialog');d.id='havenCalendar';d.className='haven-calendar';d.setAttribute('aria-label','选择日期范围');d.innerHTML='<div class="hc-top"><b>选择日期范围</b><button type="button" aria-label="关闭日历" onclick="closeDateCalendar()">×</button></div><div class="hc-nav"><button type="button" aria-label="上个月" onclick="shiftCalendar(-1)">‹</button><span class="hc-pill">日期</span><button type="button" aria-label="下个月" onclick="shiftCalendar(1)">›</button></div><div id="hcMonths" class="hc-months"></div><div id="hcRange" class="hc-range" aria-live="polite"></div><div class="hc-footer"><button type="button" onclick="clearCalendar()">清空日期</button><button type="button" class="hc-apply" id="hcApply" onclick="applyCalendar()">确认日期</button></div>';document.body.appendChild(d);d.addEventListener('click',e=>{if(e.target===d)closeDateCalendar()});d.showModal();renderCalendar()}
function closeDateCalendar(){document.getElementById('havenCalendar')?.close()}
function shiftCalendar(n){let c=havenCalendar;c.month=new Date(c.month.getFullYear(),c.month.getMonth()+n,1);renderCalendar()}
function calendarPick(value){let c=havenCalendar;if(!c.start||c.end){c.start=value;c.end=''}else if(value<c.start){c.end=c.start;c.start=value}else c.end=value;renderCalendar()}
function clearCalendar(){havenCalendar.start='';havenCalendar.end='';renderCalendar()}
function renderCalendar(){let c=havenCalendar;document.getElementById('hcMonths').innerHTML=[0,1].map(offset=>{let m=new Date(c.month.getFullYear(),c.month.getMonth()+offset,1),count=new Date(m.getFullYear(),m.getMonth()+1,0).getDate(),pad=(m.getDay()+6)%7;return `<section><h3>${m.getFullYear()}年 ${m.getMonth()+1}月</h3><div class="hc-grid">${['一','二','三','四','五','六','日'].map(x=>'<span class="hc-week">'+x+'</span>').join('')}${'<span></span>'.repeat(pad)}${Array.from({length:count},(_,i)=>{let value=calendarDate(new Date(m.getFullYear(),m.getMonth(),i+1)),edge=value===c.start||value===c.end,inside=c.start&&c.end&&value>c.start&&value<c.end;return `<button type="button" class="hc-day ${edge?'hc-selected':inside?'hc-between':''}" aria-label="${value}" aria-pressed="${edge?'true':'false'}" onclick="calendarPick('${value}')">${i+1}</button>`}).join('')}</div></section>`}).join('');document.getElementById('hcRange').textContent=c.start?c.start+' 至 '+(c.end||'请选择结束日期'):'请选择开始日期';document.getElementById('hcApply').disabled=!!c.start&&!c.end}
function applyCalendar(){let c=havenCalendar;if(c.start&&!c.end)return;$(c.a).value=c.start;$(c.b).value=c.end;dateCustom(c.key);syncDateTrigger(c.key,c.a,c.b);closeDateCalendar()}
function syncDateTrigger(key,a,b){let label=document.getElementById('date-label-'+key);if(label)label.textContent=($(a).value||'开始日期')+'　至　'+($(b).value||'结束日期')}

function exchange(){if(!allowAccountOperation())return;modal('换汇 · '+id(),`<div class="transfer-layout"><section class="transfer-entry"><h3 class="transfer-section-title">换汇信息</h3><div class="form-grid">${field('对手户口账户 *','<input id="fxCounterparty" placeholder="请输入对手户口账户" required>',true)}${field('转出币种',coinSelect('from','fxCurrencyChanged()'))}${field('转入币种',`<select id="to" onchange="fxCurrencyChanged()">${opt(coins,'CNY')}</select>`)}${field('转出金额（万） *',amountInput('fxA','updateFx()'))}${field('汇率 *','<input id="fxRate" placeholder="请输入汇率" inputmode="decimal" oninput="fxRateEdited()">')}</div><div class="transfer-passwords"><h3 class="transfer-section-title">操作验证</h3>${passwordFields('fxPwd')}</div></section><section class="transfer-info"><h3 class="transfer-section-title">换汇演示结果</h3><div id="fxPreview" class="fx-result" aria-live="polite"><div class="empty">填写左侧金额和汇率后<br>自动显示换算过程与结果</div></div></section></div>`,()=>{checkPasswords('fxPwd');let other=$('fxCounterparty').value.trim();if(!other)throw Error('请输入对手户口账户');if(other.toLowerCase()===id().toLowerCase())throw Error('对手户口不能与本户口相同');let x=fxValue();if(x.a>balances[x.f].cash)throw Error('转出币种现金余额不足');balances[x.f].cash-=x.a;balances[x.t].cash+=x.b;log('换汇转出',x.f,-x.a,other);log('换汇转入',x.t,x.b,other);closeModal();detail();toast('换汇演示成功，两币种余额已更新')},'确认换汇');$('modal').classList.add('transfer-dialog');fxCurrencyChanged()}

function fxCurrencyChanged(){let key=$('from').value+'|'+$('to').value+'|'+'mul',v=systemFxRates[key];$('fxRate').value=v||'';let hint=$('fxRateSource');if(!hint){hint=document.createElement('small');hint.id='fxRateSource';hint.className='hint';$('fxRate').parentElement.appendChild(hint)}hint.textContent=v?'已带入系统汇率，可手动调整':'系统未配置该换算汇率，请手动输入';updateFx()}

function fxValue(){let f=$('from').value,t=$('to').value;if(f===t)throw Error('转出与转入币种不能相同');let a=units($('fxA').value),[r,scale]=rate($('fxRate').value),m='mul';if(a<=0n||r<=0n)throw Error('金额和汇率必须大于零');let b=m==='mul'?a*r/scale:a*scale/r;if(b<=0n)throw Error('计算结果截断后为零，请检查输入');return{f,t,a,b,m}}

function transfer(){if(!allowAccountOperation())return;modal('转账 · '+id(),`<div class="transfer-layout"><section class="transfer-entry"><h3 class="transfer-section-title">转账信息</h3><div class="form-grid">${field('转出户口',`<input readonly value="${esc(id())} · ${esc(account.name)}">`,true)}${field('收款户口号 *','<input id="recipient" placeholder="请输入收款户口号" oninput="lookup()">',true)}<p id="lookupHint" class="hint span2" style="margin:0">输入收款户口号后，右侧自动显示户口资料。</p>${field('币种',coinSelect())}${field('转账金额 *',amountInput())}${field('备注（选填）','<textarea id="remark" placeholder="请输入备注（选填）"></textarea>',true)}</div><div class="transfer-passwords"><h3 class="transfer-section-title">操作验证</h3>${passwordFields('transferPwd')}</div></section><section class="transfer-info"><h3 class="transfer-section-title">收款户口信息</h3><div class="recipient-match" aria-live="polite"><div><span>户口名字</span><strong id="recipientName">—</strong></div><div><span>户口编号</span><strong id="recipientNumber">—</strong></div></div><div id="recipientInfo">${recipientInfo(null)}</div></section></div>`,()=>{checkPasswords('transferPwd');let r=recipients.find(x=>x.id===$('recipient').value.trim());if(!r)throw Error('请先输入可唯一匹配的演示户口号');let c=$('coin').value,a=units($('amount').value);if(a<=0n)throw Error('请输入大于零的金额');if(a>balances[c].cash)throw Error('现金余额不足');balances[c].cash-=a;r.cash+=a;r.balances[c]+=a;log('转账转出',c,-a,r.id+' '+r.name,$('remark').value.trim());txnHistory.unshift({no:'TX'+String(seq++).padStart(5,'0'),key:'recipient-'+r.id,account:r.id,name:r.name,role:r.role||'散客',type:'转账转入',coin:c,amount:a,balance:r.balances[c],recipient:r.id,remark:$('remark').value.trim(),time:now()});closeModal();detail();toast('已演示转给 '+r.name+'，金额 '+fmt(a)+' '+c)},'确认转账');$('modal').classList.add('transfer-dialog')}

let accountLocks=[];

function amountFreezeModal(mode='freeze',selectedNo=''){let active=freezes.filter(f=>f.remaining>0n);modal('冻结 / 解冻 · '+id(),`<div class="form-grid">${field('币种',coinSelect('coin','freezePreview()'))}${mode==='freeze'?field('冻结金额（万） *',amountInput('amount','freezePreview()')):field('解冻金额（万）','<input id="releaseTotal" readonly>')}${field('备注（选填）','<textarea id="reason" placeholder="请输入备注（选填）"></textarea>',true)}</div><div class="preview" id="freezePreview">冻结会直接扣减现金余额；解冻恢复对应现金。</div><input type="hidden" id="freezeMode" value="${mode}">`,()=>{let a=mode==='release'?balances[$('coin').value].frozen:units($('amount').value),why=$('reason').value.trim();if(a<=0n)throw Error(mode==='release'?'该币种暂无可解冻金额':'金额必须大于零');if(mode==='freeze'){let c=$('coin').value;if(a>balances[c].cash)throw Error('现金余额不足，不能冻结');balances[c].cash-=a;balances[c].frozen+=a;freezes.unshift({no:'FZ'+String(seq++).padStart(4,'0'),coin:c,total:a,remaining:a,why,time:now(),releases:[]});log('冻结',c,-a);recordFreezeEvent('冻结',c,a,balances[c].frozen,'','',why)}else{let c=$('coin').value;if(a>balances[c].frozen)throw Error('该币种冻结余额不足');let remaining=a,stamp=now(),releaseNo='UF'+String(seq++).padStart(4,'0');for(let f of [...freezes].reverse()){if(f.coin!==c||f.remaining<=0n||remaining<=0n)continue;let used=f.remaining<remaining?f.remaining:remaining;f.remaining-=used;f.releases.push({a:used,why,time:stamp,no:releaseNo});remaining-=used}balances[c].cash+=a;balances[c].frozen-=a;log('解冻',c,a,releaseNo);recordFreezeEvent('解冻',c,a,balances[c].frozen,'','',why)}closeModal();detail();toast(mode==='freeze'?'冻结成功，现金余额已扣减':'解冻成功，现金余额已恢复')},mode==='freeze'?'确认冻结':'确认解冻');let source=freezes.find(f=>f.no===selectedNo);if(source)$('coin').value=source.coin;freezePreview()}

let freezeEvents=[],freezeAccountKey=1,freezeAccountSeq=1,freezeIdentities={},freezeReportTab='amount',freezeQuery={q:'',type:'全部',start:'',end:''};

function freezeReport(){activeNav('冻结列表');$('pageTitle').textContent='冻结列表';$('main').innerHTML=`<div class="page-head"><div><h2>冻结列表</h2><p class="muted">查询额度冻结及户口停用启用记录</p></div></div><div class="toolbar"><button class="${freezeReportTab==='amount'?'primary':''}" onclick="switchFreezeReport('amount')">额度冻结详情</button><button class="${freezeReportTab==='account'?'primary':''}" onclick="switchFreezeReport('account')">户口冻结详情</button></div><div class="card" style="padding:14px"><div class="freeze-filters"><label>搜索户口<input id="fr-search" placeholder="户口号/姓名" value="${esc(freezeQuery.q)}" onkeydown="if(event.key==='Enter')queryFreezeReport()"></label><label>操作类型<select id="fr-type">${opt(['全部',...(freezeReportTab==='amount'?['冻结','解冻']:['冻结账户','解冻账户'])],freezeQuery.type)}</select></label>${dateSearch('fr','fr-start','fr-end',freezeQuery.start,freezeQuery.end,'queryFreezeReport()','resetFreezeReport()')}<button onclick="exportFreezeReport()">汇出</button></div><p id="fr-error" class="danger" role="alert"></p></div><div id="fr-table"></div>`;renderFreezeRows();window.scrollTo(0,0)}

function exportFreezeReport(){let rows=freezeResults();if(!rows.length){toast('暂无可汇出记录');return}let csv='\uFEFF'+[freezeHeaders(),...rows.map(freezeCells)].map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');let a=document.createElement('a'),u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.href=u;a.download=(freezeReportTab==='amount'?'额度冻结详情':'户口冻结详情')+'.csv';a.click();URL.revokeObjectURL(u)}

function releaseDetail(n){let f=freezes.find(x=>x.no===n);modal('解冻明细 · '+n,table(['金额(万)','原因','操作人','时间'],f.releases.map(r=>`<tr><td>${fmt(r.a)}</td><td>${esc(r.why)}</td><td>admin</td><td>${r.time}</td></tr>`).join('')),null)}
let formPhotos=[],audit=[];
function accountForm(fresh){let a=fresh?{code:'',number:'',name:'',alias:'',role:'散客',area:'+86',phone:'',card:'',old:false,oldId:'',oldNote:''}:account;formPhotos=[...(fresh?[]:account.photos)];accountDocDraft={...(fresh?{}:account.documents||{})};$('pageTitle').textContent=fresh?'开户':'编辑户口';$('main').innerHTML=`<div class="page-head"><h2>${fresh?'开户':'编辑户口 · '+esc(id())}</h2><button onclick="detail()">返回详情</button></div><section class="card account-form"><div class="form-section"><h3>户口信息</h3><div class="form-grid">${field('组别代码 *',`<input id="aCode" value="${esc(a.code)}" >`)}${field('户口编号 *',`<input id="aNum" value="${esc(a.number)}" >`)}${field('姓名 *',`<input id="aName" value="${esc(a.name)}">`)}${field('别名',`<input id="aAlias" value="${esc(a.alias)}">`)}${field('角色 *',`<select id="aRole">${opt(['股东线','市场线','代理线','公司线','散客'],a.role)}</select>`)}${field('会员卡号 *',`<input id="aCard" value="${esc(a.card)}" placeholder="请输入会员卡号">`)}${field('上线户口',`<input id="aUpstream" value="${esc(a.upstream||'')}" placeholder="请输入上线户口">`)}${field('介绍人',`<input id="aIntroducer" value="${esc(a.introducer==='无'?'':a.introducer||'')}" placeholder="请输入介绍人">`)}${field('开户厅',`<select id="aHall">${opt(['1F','2F','3H'],a.hall||'1F')}</select>`)}</div></div><div class="form-section"><h3>联系资料</h3><div class="form-grid">${field('区号 *',`<select id="aArea" onchange="validateAccountPhone()">${opt(['+86','+852','+853','+886','+84','+65'],a.area)}</select>`)}${field('手机号 *',`<input id="aPhone" type="tel" inputmode="tel" autocomplete="tel-national" aria-describedby="phoneHint" value="${esc(a.phone)}" placeholder="请输入手机号，不含区号" onblur="validateAccountPhone()" oninput="clearPhoneFeedback()"><small id="phoneHint" role="status" class="hint">按所选区号校验手机号格式，无需验证码</small>`)}${field('备用电话1',`<input id="aBackup1" value="${esc(a.backup1||'')}" placeholder="选填">`)}${field('备用电话2',`<input id="aBackup2" value="${esc(a.backup2||'')}" placeholder="选填">`)}${field('电子邮箱',`<input id="aEmail" type="email" value="${esc(a.email||'')}" placeholder="选填">`)}${field('短信语言',`<select id="aLanguage">${opt(['中文','英文'],a.language||'中文')}</select>`)}</div></div><div class="form-section"><h3>会员资料与证件</h3><div class="form-grid">${field('国籍',`<input id="aNationality" value="${esc(a.nationality||'')}" placeholder="选填">`)}${field('性别',`<select id="aGender">${opt(['未填写','男','女'],a.gender||'未填写')}</select>`)}${field('生日',`<input id="aBirthday" type="date" value="${esc(a.birthday||'')}">`)}${field('证件类型',`<select id="aIdType">${opt(['未选择','身份证','护照','其他'],a.idType||'未选择')}</select>`)}${field('证件号码',`<input id="aIdNumber" value="${esc(a.idNumber||'')}" placeholder="选填">`)}<div class="span2 upload"><label>照片信息 *（1–2 张）<input type="file" accept="image/png,image/jpeg,image/webp" multiple onchange="addPhotos(this)"></label><div id="photoList"></div><p class="hint">图片仅在当前页面预览，不上传。最多两张，PNG / JPG / WebP，每张不超过 10 MB。</p></div></div></div><div class="form-section"><h3>备注</h3><div class="form-grid">${field('内部备注（选填）',`<textarea id="aInternalNote" placeholder="请输入内部备注">${esc(a.internalNote||'')}</textarea>`)}${field('客户备注（选填）',`<textarea id="aClientNote" placeholder="请输入客户备注">${esc(a.clientNote||'')}</textarea>`)}</div></div><div class="form-section"><h3>操作验证</h3>${passwordFields('accountPwd')}</div><div class="sticky-actions"><span id="formError" class="feedback" role="alert"></span><button onclick="detail()">取消</button><button class="primary" onclick="saveAccount(${fresh})">${fresh?'确认开户':'保存户口'}</button></div></section>`;photoList();window.scrollTo(0,0)}
let accountDocDraft={};
function accountDocField(key,title){let p=accountDocDraft[key];return field(title+'（选填）',`<input type="file" accept="image/png,image/jpeg,image/webp" onchange="accountDocUpload('${key}',this)"><div id="doc_${key}">${p?`<img src="${esc(p.url)}" alt="${title}" style="height:60px;margin-top:8px"><small>${esc(p.name)}</small>`:''}</div>`)}
function accountDocUpload(key,input){let f=input.files[0];if(!f)return;if(!['image/png','image/jpeg','image/webp'].includes(f.type)||f.size>10*1024*1024){$('formError').textContent='请上传不超过10MB的 PNG、JPG 或 WebP 图片';input.value='';return}accountDocDraft[key]={name:f.name,url:URL.createObjectURL(f)};$('doc_'+key).innerHTML=`<img src="${accountDocDraft[key].url}" alt="证件预览" style="height:60px;margin-top:8px"><small>${esc(f.name)}</small>`}
function readAccountExtras(){let keys={upstream:'aUpstream',introducer:'aIntroducer',hall:'aHall',backup1:'aBackup1',backup2:'aBackup2',email:'aEmail',language:'aLanguage',nationality:'aNationality',gender:'aGender',birthday:'aBirthday',idType:'aIdType',idNumber:'aIdNumber',internalNote:'aInternalNote',clientNote:'aClientNote'};return Object.fromEntries(Object.entries(keys).map(([k,id])=>[k,$(id).value.trim()]))}
function addPhotos(input){let files=[...input.files];$('formError').textContent='';if(formPhotos.length+files.length>2){$('formError').textContent='照片信息最多上传两张，请先移除已有照片后再上传';input.value='';return}for(let f of files){if(!['image/png','image/jpeg','image/webp'].includes(f.type)||f.size>10*1024*1024){$('formError').textContent='图片格式或大小不符合要求';input.value='';return}}for(let f of files)formPhotos.push({name:f.name,url:URL.createObjectURL(f)});input.value='';photoList()}
function photoList(){$('photoList').innerHTML=formPhotos.map((p,i)=>`<span class="thumb"><img alt="会员卡预览" src="${p.url}">${esc(p.name)}<button onclick="formPhotos.splice(${i},1);photoList()">移除</button></span>`).join('')}
function phoneFormatError(area,phone){let lengths={'+86':11,'+852':8,'+853':8,'+886':9,'+84':9,'+65':8};if(!phone)return '请输入手机号';if(!lengths[area])return '请选择有效区号';if(!/^\d+$/.test(phone))return '手机号仅支持数字，请勿重复填写区号或输入空格、字母、符号';if(phone.length!==lengths[area])return area+' 手机号须为 '+lengths[area]+' 位数字（不含区号）';if(area==='+86'&&!/^1[3-9]\d{9}$/.test(phone))return '+86 手机号须为1开头、第二位3–9的11位数字';return ''}
function validateAccountPhone(){let message=phoneFormatError($('aArea').value,$('aPhone').value.trim()),input=$('aPhone'),hint=$('phoneHint');input.setAttribute('aria-invalid',message?'true':'false');input.style.borderColor=message?'#dc3545':'';hint.textContent=message||'手机号格式正确';hint.style.color=message?'#c62828':'#23834a';return !message}
function clearPhoneFeedback(){$('aPhone').setAttribute('aria-invalid','false');$('aPhone').style.borderColor='';$('phoneHint').textContent='按所选区号校验手机号格式，无需验证码';$('phoneHint').style.color=''}
function saveAccount(fresh){try{if(!formPhotos.length)throw Error('请至少上传一张照片');if(formPhotos.length>2)throw Error('照片信息最多上传两张');checkPasswords('accountPwd');let name=$('aName').value.trim(),phone=$('aPhone').value.trim(),area=$('aArea').value,code=$('aCode').value.trim(),number=$('aNum').value.trim();if(!name||!code||!number||!$('aCard').value.trim())throw Error('请填写姓名、组别、编号、会员卡号');if(!/^[A-Za-z0-9]+$/.test(code+number))throw Error('演示组别与编号仅支持字母和数字');if(recipients.some(r=>r.id===code+number))throw Error('户口号已存在');if(!validateAccountPhone()){$('aPhone').focus();throw Error($('phoneHint').textContent)}account={...account,code,number,name,alias:$('aAlias').value.trim(),role:$('aRole').value,area,phone,card:$('aCard').value.trim(),photos:[...formPhotos],...readAccountExtras(),documents:{...accountDocDraft}};if(fresh){freezeAccountKey=++freezeAccountSeq;financeOpenedAccounts.push({key:freezeAccountKey,created:now()});balances=Object.fromEntries(coins.map(c=>[c,{cash:0n,stored:0n,frozen:0n}]));freezes=[];ledger=[];notes=[];rateConfigs={};account.auth='尚未设置授权人';account.authorizedPeople=[];account.locked=false;accountLocks=[];account.isNew=true;approval=null}freezeIdentities[freezeAccountKey]={number:id(),name:account.name};audit.unshift({type:fresh?'新开户':'编辑户口资料',text:id(),time:now()});detail();toast('户口资料已保存到当前演示会话')}catch(e){$('formError').textContent=e.message}}
function approvalModal(){modal('组别 / 编号变更审批',`<div class="notice">以下为审批状态演示；正式系统须校验最高授权人权限，授权名单及自审规则待确认。</div>${approval?`<p>状态：${esc(approval.status)} · ${esc(approval.code+approval.number)}</p><p>原因：${esc(approval.reason)}</p>${approval.status==='待审批'?'<div class="inline"><button onclick="decideApproval(true)">演示最高授权人同意</button><button onclick="decideApproval(false)">演示最高授权人拒绝</button></div>':''}`:''}<div class="form-grid" style="margin-top:16px">${field('新组别代码',`<input id="newCode" value="${esc(account.code)}">`)}${field('新户口编号',`<input id="newNum" value="${esc(account.number)}">`)}${field('申请原因 *','<textarea id="appReason"></textarea>',true)}</div>`,()=>{let code=$('newCode').value.trim(),number=$('newNum').value.trim(),reason=$('appReason').value.trim();if(!/^[A-Za-z0-9]+$/.test(code)||!/^[A-Za-z0-9]+$/.test(number)||!reason)throw Error('请填写有效组别、编号及原因');if(code+number===id())throw Error('申请内容没有变化');if(recipients.some(r=>r.id===code+number))throw Error('户口号已存在');approval={code,number,reason,status:'待审批'};audit.unshift({type:'提交编号变更申请',text:id()+' → '+code+number,time:now()});approvalModal()},'提交审批')}
function decideApproval(yes){try{checkPasswords('actionPwd')}catch(e){$('error').textContent=e.message;return}if(!approval||approval.status!=='待审批')return;approval.status=yes?'已同意':'已拒绝';if(yes){account.code=approval.code;account.number=approval.number}audit.unshift({type:'模拟最高授权人'+approval.status,text:approval.code+approval.number,time:now()});closeModal();detail();toast(yes?'审批同意，新组别和编号已生效':'审批拒绝，原编号保留')}
const rateFields=['占成比','对应码粮比'];
function personalRate(c,mode){let r=rateConfigs[c];return r?.[mode]?.values||(r?.mode===mode?r.values:['',''])}
function rateSummary(){return table(['币种','结算方式','占成比','对应码粮比'],coins.flatMap(c=>['即结','月结'].map(mode=>`<tr><td>${c}</td><td>${mode}</td>${personalRate(c,mode).map(v=>`<td>${v!==''?esc(v)+'%':'角色默认'}</td>`).join('')}</tr>`)).join(''))}
function rates(){modal('个人码粮设置 · '+id(),`<p class="hint">即结与月结分别设置，同时保留。留空沿用角色默认，0 表示明确为零。</p><div class="table-wrap"><table class="rate-matrix"><thead><tr><th>币种</th><th>结算方式</th><th>占成比 (%)</th><th>对应码粮比 (%)</th></tr></thead><tbody>${coins.flatMap(c=>['即结','月结'].map((mode,j)=>`<tr><td>${c}</td><td>${mode}</td>${personalRate(c,mode).map((v,i)=>`<td><input id="rate_${c}_${j}_${i}" aria-label="${c} ${mode} ${rateFields[i]}" value="${esc(v)}" placeholder="角色默认" inputmode="decimal"></td>`).join('')}</tr>`)).join('')}</tbody></table></div>${passwordFields('personalRatePwd')}`,()=>{checkPasswords('personalRatePwd');let next={};for(let c of coins){next[c]={};for(let [j,mode] of ['即结','月结'].entries()){let values=[0,1].map(i=>$('rate_'+c+'_'+j+'_'+i).value.trim());for(let v of values)if(v!==''&&(!/^\d+(\.\d{1,4})?$/.test(v)||Number(v)>100))throw Error(c+' '+mode+'：比例须为0–100，最多四位小数');next[c][mode]={values}}}rateConfigs=next;audit.unshift({type:'个人码粮设置',text:'分别保存即结与月结比例',time:now()});closeModal();detail();toast('即结与月结配置已保存')},'保存全部配置');$('modal').classList.add('rates-dialog')}

function blankAuth(){return {name:'',area:'+86',phone:'',types:[],card:'',photo:null,remark:''}}
function authorizedSummary(){let people=account.authorizedPeople||[];if(!people.length)return '<div class="card-body"><span class="muted">尚未设置授权人</span></div>';return `<div class="auth-summary">${people.map((x,i)=>`<article class="auth-summary-person">${x.photo?`<button class="auth-photo-button" onclick="previewAuthPhoto(${i})" aria-label="查看${esc(x.name)}的照片"><img src="${esc(x.photo.url)}" alt="${esc(x.name)}的照片" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><span hidden>图片加载失败</span></button>`:''}<div class="auth-summary-info"><div class="auth-summary-name"><strong>${esc(x.name)}</strong><small>授权人 ${i+1}</small></div><div class="auth-summary-fields"><span><small>电话</small> ${x.phone?esc((x.area?x.area+' ':'')+x.phone):'未填写'}</span><span><small>会员卡号</small> ${esc(x.card)||'未填写'}</span></div><div class="auth-permissions">${x.types.length?x.types.map(t=>`<span>${esc(t)}</span>`).join(''):'<small>未设置授权种类</small>'}</div>${x.remark?`<p class="auth-summary-remark"><small>备注</small> ${esc(x.remark)}</p>`:''}</div></article>`).join('')}</div>`}
function previewAuthPhoto(i){let x=account.authorizedPeople?.[i];if(!x?.photo)return;modal('授权人照片 · '+x.name,`<img src="${esc(x.photo.url)}" alt="${esc(x.name)}的照片" style="width:100%;max-height:60vh;object-fit:contain"><p class="hint">${esc(x.photo.name)}</p>`,null);$('modalFoot').innerHTML='<button onclick="closeModal()">关闭</button>'}
function authModal(){authDraft=(account.authorizedPeople||[]).map(x=>({...x,types:[...x.types]}));if(!authDraft.length)authDraft=[blankAuth()];modal('编辑授权人',`<div id="authRows"></div><button onclick="addAuthRow()" style="margin:10px 0 16px">＋ 新增授权人</button><div class="form-grid" style="padding-top:16px;border-top:1px solid var(--line)">${field('操作人密码 *','<input id="authOperatorPassword" type="password" autocomplete="off" placeholder="请输入操作人密码">')}${field('确认人密码 *','<input id="authConfirmPassword" type="password" autocomplete="off" placeholder="请输入确认人密码">')}</div>`,saveAuth);renderAuthRows()}
function renderAuthRows(){$('authRows').innerHTML=authDraft.map((x,i)=>`<section class="auth-person"><div class="inline" style="justify-content:space-between;margin-bottom:12px"><strong>授权人 ${i+1}</strong><button class="danger" onclick="authDraft.splice(${i},1);renderAuthRows()">移除</button></div><div class="auth-three">${field('姓名 *',`<input value="${esc(x.name)}" oninput="authDraft[${i}].name=this.value">`)}${field('区号',`<input value="${esc(x.area)}" oninput="authDraft[${i}].area=this.value">`)}${field('电话',`<input value="${esc(x.phone)}" placeholder="电话" oninput="authDraft[${i}].phone=this.value">`)}</div><label style="margin:12px 0 5px">授权种类</label><div class="inline" style="gap:10px">${authTypes.map((t,j)=>`<label><input type="checkbox" ${x.types.includes(t)?'checked':''} onchange="setAuthType(${i},${j},this.checked)">${t}</label>`).join('')}</div><div class="form-grid" style="margin-top:12px">${field('会员卡号',`<input value="${esc(x.card)}" oninput="authDraft[${i}].card=this.value">`)}${field('照片',`<input type="file" accept="image/png,image/jpeg,image/webp" onchange="authPhoto(${i},this)"><div id="authPhoto_${i}">${authPhotoMarkup(x.photo)}</div>`)}${field('备注（选填）',`<input value="${esc(x.remark)}" placeholder="手打备注（可选）" oninput="authDraft[${i}].remark=this.value">`,true)}</div></section>`).join('')||'<div class="empty">暂无授权人，可点击新增授权人。</div>'}
function authPhotoMarkup(p){return p?`<img src="${esc(p.url)}" alt="授权人照片" style="height:60px;max-width:140px;object-fit:contain;margin-top:8px"><small> ${esc(p.name)}</small>`:''}
function addAuthRow(){authDraft.push(blankAuth());renderAuthRows()}
function setAuthType(i,j,on){let t=authTypes[j];authDraft[i].types=on?[...new Set([...authDraft[i].types,t])]:authDraft[i].types.filter(v=>v!==t)}
function authPhoto(i,input){let f=input.files[0];if(!f)return;if(!['image/png','image/jpeg','image/webp'].includes(f.type)||f.size>10*1024*1024){$('error').textContent='请上传不超过10MB的 PNG、JPG 或 WebP 图片';input.value='';return}authDraft[i].photo={name:f.name,url:URL.createObjectURL(f)};$('authPhoto_'+i).innerHTML=authPhotoMarkup(authDraft[i].photo);$('error').textContent=''}
function saveAuth(){for(let [i,x] of authDraft.entries())if(!x.name.trim())throw Error('请填写授权人 '+(i+1)+' 的姓名');let op=$('authOperatorPassword').value,cf=$('authConfirmPassword').value;if(!op.trim())throw Error('请输入操作人密码');if(!cf.trim())throw Error('请输入确认人密码');if(op===cf)throw Error('操作人密码与确认人密码不可相同');account.authorizedPeople=authDraft.map(x=>({...x,name:x.name.trim(),types:[...x.types]}));account.auth=account.authorizedPeople.map(x=>x.name).join('、')||'尚未设置授权人';$('authOperatorPassword').value='';$('authConfirmPassword').value='';audit.unshift({type:'修改授权人',text:'保存 '+authDraft.length+' 位授权人',time:now()});closeModal();detail();toast('授权人已保存')}
function scopeName(n){return n.scope==='all'?'所有人可见':n.scope==='internal'?'内部（仅同部门可见）':'指定人员：'+(n.people||[]).join('、')}
function noteVersions(n){return [{...n,time:n.edited||n.created},...(n.history||[])].map(v=>`<div style="padding:9px 0;border-bottom:1px solid var(--line)"><p style="white-space:pre-wrap">${esc(v.text)}</p><small>${esc(v.department||'场面')} · ${esc(scopeName(v))} · admin · ${esc(v.time)}</small></div>`).join('')}
function noteTimeline(){return `<section class="note-log"><h3>备注记录 <small>（${notes.length}）</small></h3><div class="note-log-scroll"><ol class="note-timeline">${notes.map((r,j)=>({r,j})).sort((a,b)=>(b.r.edited||b.r.created).localeCompare(a.r.edited||a.r.created)).map(({r,j})=>`<li><div class="note-log-meta"><time>${esc(r.edited||r.created)}</time><span>操作人：${esc(r.edited?(r.editor||'admin'):r.author)}</span><span>${r.edited?'修改备注':'新增备注'}</span></div><p class="note-log-text">${esc(r.text)}</p><small>部门：${esc(r.department||'场面')}　可见范围：${esc(scopeName(r))}</small><div class="note-log-actions"><button class="link" onclick="noteModal(${j})">编辑</button><details><summary>修改记录</summary><small>创建人：${esc(r.author)}　创建时间：${esc(r.created)}${r.edited?'　最近编辑时间：'+esc(r.edited):''}</small>${noteVersions(r)}</details></div></li>`).join('')}</ol>${notes.length?'':'<div class="empty">暂无备注</div>'}</div></section>`}
function noteModal(i){let n=notes[i]||{text:'',department:'场面',scope:'internal',people:[]};modal('户口备注管理',`<section style="background:#f9fafb;border:1px solid var(--line);border-radius:7px;padding:13px"><h3 style="font-size:14px;margin-bottom:8px">${i===undefined?'新增备注':'编辑备注'}</h3>${field('部门',`<select id="noteDepartment">${opt(['场面'],n.department||'场面')}</select>`)}<div style="margin-top:10px">${field('可见范围',`<select id="noteScope" onchange="$('people').hidden=this.value!=='specific'"><option value="internal" ${n.scope==='internal'?'selected':''}>内部（仅同部门可见）</option><option value="all" ${n.scope==='all'?'selected':''}>所有人可见</option><option value="specific" ${n.scope==='specific'?'selected':''}>指定人员可见</option></select>`)}</div><div id="people" class="inline" style="margin-top:8px" ${n.scope==='specific'?'':'hidden'}>${['账房主管','客服甲','财务乙'].map(p=>`<label><input type="checkbox" name="person" value="${p}" ${(n.people||[]).includes(p)?'checked':''}>${p}</label>`).join('')}</div><textarea aria-label="备注内容" id="noteText" style="margin-top:8px;min-height:66px" placeholder="请输入备注内容（选填）...">${esc(n.text)}</textarea>${passwordFields('notePwd')}<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:10px">${i===undefined?'':'<button onclick="noteModal()">取消编辑</button>'}<button class="primary" onclick="saveNote(${i===undefined?'undefined':i})">${i===undefined?'添加':'保存修改'}</button></div></section><p class="hint">演示部门取自截图；正式部门选项沿用后台部门配置。当前为管理员演示视图。</p>${noteTimeline()}`,null);$('modalFoot').innerHTML='<button onclick="closeModal()">关闭</button>'}
function saveNote(i){try{checkPasswords('notePwd');let text=$('noteText').value.trim(),department=$('noteDepartment').value,scope=$('noteScope').value,people=scope==='specific'?[...document.querySelectorAll('[name=person]:checked')].map(e=>e.value):[];if(!department)throw Error('请选择部门');if(scope==='specific'&&!people.length)throw Error('请选择至少一位可见人员');let t=now();if(i===undefined)notes.unshift({text,department,scope,people,created:t,edited:null,author:'admin',history:[]});else{let previous=notes[i];previous.history=previous.history||[];previous.history.unshift({text:previous.text,department:previous.department||'场面',scope:previous.scope,people:[...(previous.people||[])],time:previous.edited||previous.created});Object.assign(previous,{text,department,scope,people,edited:t})}audit.unshift({type:i===undefined?'新增备注':'编辑备注',text:'部门：'+department+'；'+scopeName({scope,people}),time:t});detail();noteModal();toast(i===undefined?'备注已添加':'备注已修改')}catch(e){$('error').textContent=e.message}}
function noteHistory(i){let n=notes[i];modal('备注修改记录',noteVersions(n),null)}
function logs(){activeNav('操作日志');$('pageTitle').textContent='操作日志';$('main').innerHTML=card('资料与设置操作',table(['动作','内容','操作人','时间'],audit.map(a=>`<tr><td>${esc(a.type)}</td><td>${esc(a.text)}</td><td>admin</td><td>${a.time}</td></tr>`).join('')))+card('资金操作',ledgerTable())}
function help(){modal('原型说明 / 评审边界',`<p>本文件沿用现有后台的深色导航、蓝色按钮和白色表格布局，提供户口管理调整的可点击演示。</p><div class="notice" style="margin-top:16px">全部为虚构数据，仅保存在页面内存。刷新恢复初始状态；不连接真实后台，不上传图片或提交资金业务。</div><p>建议体验：编辑 / 开户 → 个人码粮设置 → 冻结 → 冻结列表解冻 → 换汇 → 转账 → 备注与审批。</p><p style="margin-top:12px">已确认：冻结直接扣减现金余额；解冻恢复现金；结算周期为即结和月结。</p><p style="margin-top:12px">待确认：金额精度对应元还是万、存卡交收转换规则、角色与佣金公式、会员卡绑定规则、最高审批权限、手机号各地区完整规则、部分解冻和可见人员范围。</p><p class="hint">演示沿用现界面“万”单位并截断至四位小数；部分解冻可体验但不代表已确认业务。非本次范围的菜单保留入口说明。</p>`,null)}
function activeNav(title){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('selected',b.textContent===title));document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.textContent.includes(title==='户口详情'?'户口管理':title)))}
window.addEventListener?.('resize',measureDetailNotes);

let sessionReady=false,sessionPending=null,sessionIdentity=id(),sessionCreditUse={},accountSaveInProgress=false;
function accountSessionSnapshot(){return {id:id(),previousId:sessionIdentity,name:account.name,card:account.card,locked:!!account.locked,rateConfigs:JSON.parse(JSON.stringify(rateConfigs)),role:account.role,cash:Object.fromEntries(coins.map(c=>[c,balances[c].cash])),stored:Object.fromEntries(coins.map(c=>[c,balances[c].stored])),credit:Object.fromEntries(coins.map(c=>[c,creditInfo(c)?.available||0n]))}}
function syncSessionAccount(){if(!sessionReady)return;$('sessionFrame').contentWindow.sessionBridge.sync(accountSessionSnapshot());sessionIdentity=id()}
function sessionTitleChanged(t){if(document.body.classList.contains('session-mode'))$('pageTitle').textContent=t}
function sessionModuleReady(){sessionReady=true;syncSessionAccount();if(sessionPending){let p=sessionPending;sessionPending=null;openSessions(p.action,p.value)}}
function openSessions(action='list',value=''){if($('modal').open)closeModal();document.body.classList.add('session-mode');activeNav(action==='settings'?'佣金占成设置':'开工管理');$('pageTitle').textContent=action==='open'?'新开工':action==='settings'?'佣金占成设置':'开工管理';if(!sessionReady){sessionPending={action,value};return}syncSessionAccount();$('sessionFrame').contentWindow.sessionBridge.navigate(action,value)}
function startAccountSession(){if(!allowAccountOperation())return;openSessions('open',id())}
function leaveSessions(){document.body.classList.remove('session-mode')}
function accountSessionTable(){let rows=sessionReady?$('sessionFrame').contentWindow.sessionBridge.records(id()):[];return table(['场次号','类型','币种','本金(万)','转码(万)','状态','开工时间','操作'],rows.map(s=>`<tr><td>${esc(s.id)}</td><td>${esc(s.type)}</td><td>${s.cur}</td><td>${fmt(s.initial)}</td><td>${fmt(s.roll)}</td><td>${esc(s.status)}</td><td>${esc(s.opened)}</td><td><button class="link" onclick="openSessions('detail','${esc(s.id)}')">查看</button></td></tr>`).join(''))}
function sessionAccountChanged(a){if(a.id!==id())return;for(let c of coins){let cashDelta=(a.cash?.[c]??balances[c].cash)-balances[c].cash;if(cashDelta!==0n){balances[c].cash+=cashDelta;log('取款',c,cashDelta,'','现金余额加彩 · '+a.session)}let available=creditInfo(c)?.available||0n;sessionCreditUse[c]=(sessionCreditUse[c]||0n)+available-a.credit[c];let delta=a.stored[c]-balances[c].stored;if(delta!==0n&&['开工','加彩','收工'].includes(a.operation)){txnHistory.unshift({no:'TX'+String(seq++).padStart(5,'0'),key:freezeAccountKey,account:id(),name:account.name,role:account.role,type:a.operation==='加彩'?'加彩存卡':a.operation==='开工'?'存卡开工':'收工存卡',coin:c,amount:delta,balance:a.stored[c],recipient:'',remark:a.operation+' · '+a.session+'（存卡余额）',time:now()})}balances[c].stored=a.stored[c]}audit.unshift({type:'开工管理联动',text:a.session,time:now()})}
const baseCreditInfo=creditInfo;
creditInfo=function(c){let b=baseCreditInfo(c);if(!b)return null;let used=sessionCreditUse[c]||0n;return {...b,debt:b.debt+used,available:b.available-used}};
const baseAccountSave=saveAccount;
saveAccount=function(fresh){let old=account;let previous=id();accountSaveInProgress=true;try{baseAccountSave(fresh)}finally{accountSaveInProgress=false}if(old!==account){if(fresh){sessionIdentity=id();sessionCreditUse={}}else sessionIdentity=previous;syncSessionAccount();baseAccountDetail()}};
const baseAccountDetail=detail;
detail=function(){leaveSessions();if(!accountSaveInProgress)syncSessionAccount();baseAccountDetail()};
const baseAccountList=showList;
showList=function(){leaveSessions();baseAccountList()};
const baseAccountForm=accountForm;
accountForm=function(fresh){leaveSessions();baseAccountForm(fresh)};
const baseFreezeReport=freezeReport;
freezeReport=function(){leaveSessions();baseFreezeReport()};
const baseMenu=menu;
menu=function(n){if(n==='开工管理')return openSessions();if(n==='佣金占成设置')return openSessions('settings');if(n==='户口管理')return showList();if(n==='冻结列表')return freezeReport();if(n==='操作日志')leaveSessions();return baseMenu(n)};
