<script>
function dateSearch(key,startId,endId,start='',end='',search='',reset=''){return `<div class="date-search" data-date-key="${key}"><span class="date-search-label">时间</span><div class="date-shortcuts">${['今天','昨天','本周','上周','本月','上月','自定义'].map((t,i)=>`<button type="button" data-preset="${i}" class="${i===6&&(start||end)?'selected':''}" onclick="chooseDates('${key}','${startId}','${endId}',${i})">${t}</button>`).join('')}</div><input type="hidden" id="${startId}" value="${start.slice(0,10)}"><input type="hidden" id="${endId}" value="${end.slice(0,10)}"><button type="button" class="date-range-trigger" aria-haspopup="dialog" onclick="openDateCalendar('${key}','${startId}','${endId}')"><span aria-hidden="true">▦</span><span id="date-label-${key}">${start.slice(0,10)||'开始日期'}　至　${end.slice(0,10)||'结束日期'}</span></button><button class="date-search-submit" onclick="${search}">⌕ 搜索</button><button class="date-search-reset" onclick="${reset}">↻ 重置</button></div>`}
function dateCustom(key){document.querySelectorAll('[data-date-key="'+key+'"] [data-preset]').forEach(b=>b.classList.toggle('selected',b.dataset.preset==='6'))}
function searchDateBounds(i,today){let start=new Date(today.getFullYear(),today.getMonth(),today.getDate()),end=new Date(start);if(i===1){start.setDate(start.getDate()-1);end=new Date(start)}if(i===2||i===3){let offset=(start.getDay()+6)%7;start.setDate(start.getDate()-offset-(i===3?7:0));if(i===3){end=new Date(start);end.setDate(end.getDate()+6)}}if(i===4)start.setDate(1);if(i===5){start=new Date(start.getFullYear(),start.getMonth()-1,1);end=new Date(start.getFullYear(),start.getMonth()+1,0)}let fmt=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');return [fmt(start),fmt(end)]}
function chooseDates(key,a,b,i){document.querySelectorAll('[data-date-key="'+key+'"] [data-preset]').forEach(el=>el.classList.toggle('selected',el.dataset.preset===String(i)));if(i===6){openDateCalendar(key,a,b);return}let today=new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Shanghai'})),range=searchDateBounds(i,today);$(a).value=range[0];$(b).value=range[1];syncDateTrigger(key,a,b)}
let havenCalendar=null;
function calendarDate(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function openDateCalendar(key,a,b){let old=document.getElementById('havenCalendar');if(old)old.remove();let date=$(a).value?new Date($(a).value+'T12:00:00'):new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Shanghai'}));havenCalendar={key,a,b,start:$(a).value,end:$(b).value,month:new Date(date.getFullYear(),date.getMonth(),1)};let d=document.createElement('dialog');d.id='havenCalendar';d.className='haven-calendar';d.setAttribute('aria-label','选择日期范围');d.innerHTML='<div class="hc-top"><b>选择日期范围</b><button type="button" aria-label="关闭日历" onclick="closeDateCalendar()">×</button></div><div class="hc-nav"><button type="button" aria-label="上个月" onclick="shiftCalendar(-1)">‹</button><span class="hc-pill">日期</span><button type="button" aria-label="下个月" onclick="shiftCalendar(1)">›</button></div><div id="hcMonths" class="hc-months"></div><div id="hcRange" class="hc-range" aria-live="polite"></div><div class="hc-footer"><button type="button" onclick="clearCalendar()">清空日期</button><button type="button" class="hc-apply" id="hcApply" onclick="applyCalendar()">确认日期</button></div>';document.body.appendChild(d);d.addEventListener('click',e=>{if(e.target===d)closeDateCalendar()});d.showModal();renderCalendar()}
function closeDateCalendar(){document.getElementById('havenCalendar')?.close()}
function shiftCalendar(n){let c=havenCalendar;c.month=new Date(c.month.getFullYear(),c.month.getMonth()+n,1);renderCalendar()}
function calendarPick(value){let c=havenCalendar;if(!c.start||c.end){c.start=value;c.end=''}else if(value<c.start){c.end=c.start;c.start=value}else c.end=value;renderCalendar()}
function clearCalendar(){havenCalendar.start='';havenCalendar.end='';renderCalendar()}
function renderCalendar(){let c=havenCalendar;document.getElementById('hcMonths').innerHTML=[0,1].map(offset=>{let m=new Date(c.month.getFullYear(),c.month.getMonth()+offset,1),count=new Date(m.getFullYear(),m.getMonth()+1,0).getDate(),pad=(m.getDay()+6)%7;return `<section><h3>${m.getFullYear()}年 ${m.getMonth()+1}月</h3><div class="hc-grid">${['一','二','三','四','五','六','日'].map(x=>'<span class="hc-week">'+x+'</span>').join('')}${'<span></span>'.repeat(pad)}${Array.from({length:count},(_,i)=>{let value=calendarDate(new Date(m.getFullYear(),m.getMonth(),i+1)),edge=value===c.start||value===c.end,inside=c.start&&c.end&&value>c.start&&value<c.end;return `<button type="button" class="hc-day ${edge?'hc-selected':inside?'hc-between':''}" aria-label="${value}" aria-pressed="${edge?'true':'false'}" onclick="calendarPick('${value}')">${i+1}</button>`}).join('')}</div></section>`}).join('');document.getElementById('hcRange').textContent=c.start?c.start+' 至 '+(c.end||'请选择结束日期'):'请选择开始日期';document.getElementById('hcApply').disabled=!!c.start&&!c.end}
function applyCalendar(){let c=havenCalendar;if(c.start&&!c.end)return;$(c.a).value=c.start;$(c.b).value=c.end;dateCustom(c.key);syncDateTrigger(c.key,c.a,c.b);closeDateCalendar()}
function syncDateTrigger(key,a,b){let label=document.getElementById('date-label-'+key);if(label)label.textContent=($(a).value||'开始日期')+'　至　'+($(b).value||'结束日期')}

function compactPager(total,page,size,key,change){let pages=Math.max(1,Math.ceil(total/size));compactPageHandlers.set(key,{pages,change});let first=Math.max(1,Math.min(page-2,pages-4)),last=Math.min(pages,first+4);let button=(n,text,label,disabled=false)=>`<button type="button" class="page-arrow" aria-label="${label}" ${disabled?'disabled':''} onclick="compactPageGo('${key}',${n})">${text}</button>`;return `<div class="compact-pagination"><span>共 ${total} 笔</span>${button(1,'«','首页',page===1)}${button(page-1,'‹','上一页',page===1)}${Array.from({length:last-first+1},(_,i)=>first+i).map(n=>`<button type="button" class="page-number ${n===page?'current':''}" ${n===page?'aria-current="page"':''} onclick="compactPageGo('${key}',${n})">${n}</button>`).join('')}${button(page+1,'›','下一页',page===pages)}${button(pages,'»','末页',page===pages)}<label class="page-jump">GO <input id="jump-${key}" aria-label="跳转页码" inputmode="numeric" oninput="document.getElementById('jump-btn-${key}').disabled=!/^\\d+$/.test(this.value)||Number(this.value)<1||Number(this.value)>${pages}" onkeydown="if(event.key==='Enter')compactPageGo('${key}',this.value)"> 页</label><button type="button" id="jump-btn-${key}" class="page-query" disabled onclick="compactPageGo('${key}',document.getElementById('jump-${key}').value)">查询</button></div>`}
function compactPageGo(key,value){let h=compactPageHandlers.get(key),n=Number(value);if(!h||!/^\d+$/.test(String(value))||!Number.isInteger(n)||n<1||n>h.pages)return;h.change(n)}

function listPaginationMarkup(id){let s=listPaginationStates.get(id),total=s.rows.length,pages=Math.max(1,Math.ceil(total/s.size));s.page=Math.min(Math.max(1,s.page),pages);let start=(s.page-1)*s.size;return `<div class="table-wrap"><table><thead><tr>${s.headers.map(h=>'<th>'+h+'</th>').join('')}</tr></thead><tbody>${s.rows.slice(start,start+s.size).join('')||`<tr><td colspan="${s.headers.length}" class="empty">暂无记录</td></tr>`}</tbody></table></div>${compactPager(total,s.page,s.size,id,n=>changeListPage(id,n))}`}

function commitCounterpartyExchange(x,other){
 let peer=recipients.find(r=>r.id.toLowerCase()===other.toLowerCase());
 if(!peer)throw Error('对手户口不存在，请核对户口号');
 if(peer.id.toLowerCase()===id().toLowerCase())throw Error('对手户口不能与本户口相同');
 if(peer.locked)throw Error('对手户口已冻结，不能换汇');
 if(x.a<=0n||x.b<=0n||x.f===x.t)throw Error('换汇币种或金额无效');
 if(x.a>balances[x.f].cash)throw Error('本账户转出币种余额不足');
 if(x.b>(peer.balances[x.t]||0n))throw Error('对手户口 '+peer.id+' 的 '+x.t+' 余额不足');
 balances[x.f].cash-=x.a;balances[x.t].cash+=x.b;
 peer.balances[x.f]=(peer.balances[x.f]||0n)+x.a;peer.balances[x.t]-=x.b;
 let ref=recordExchange(x,peer.id),note=ref+' · '+x.f+' → '+x.t;
 log('换汇转出',x.f,-x.a,peer.id,note);log('换汇转入',x.t,x.b,peer.id,note);
 peer.ledger||=[];
 for(let [type,coin,amount] of [['换汇转入',x.f,x.a],['换汇转出',x.t,-x.b]]){
  let row={no:'TX'+String(seq++).padStart(5,'0'),exchangeNo:ref,key:'recipient-'+peer.id,account:peer.id,name:peer.name,role:peer.role||'散客',type,coin,amount,balance:peer.balances[coin],recipient:id(),remark:note,time:now()};
  peer.ledger.unshift({...row});txnHistory.unshift(row);
 }
 Object.assign(exchangeHistory[0],{peerFromBalance:peer.balances[x.f],peerToBalance:peer.balances[x.t]});

function submitChips(){try{checkPasswords('chipPwd');let type=$('chip-type').value,coin=$('chip-coin').value,i=companyCurrencies.indexOf(coin),mud=units($('chip-mud').value||'0'),cash=units($('chip-cash').value||'0');if(!['账房现金换筹码','账房筹码换现金'].includes(type)||i<0)throw Error('请选择项目和币别');if(mud<0n||cash<0n||mud+cash<=0n)throw Error('泥码、现码不可为负，合计须大于零');let sum=mud+cash,into=type==='账房现金换筹码';if(into&&sum>companyBalance('WBYD',i))throw Error('账房现金余额不足');if(!into&&(mud>chipStock.mud[i]||cash>chipStock.cash[i]))throw Error('账房筹码余额不足');let cashBefore=companyBalance('WBYD',i),chipBefore=chipStock.cash[i],mudBefore=chipStock.mud[i];companyFunds.WBYD[i]=fmt(cashBefore+(into?-sum:sum));chipStock.mud[i]+=into?mud:-mud;chipStock.cash[i]+=into?cash:-cash;chipRows.unshift({no:'E-DEMO'+String(companySequence++).padStart(6,'0'),type,coin,mud,cash,sum,cashBefore,chipBefore,mudBefore,cashAfter:companyBalance('WBYD',i),chipAfter:chipStock.cash[i],mudAfter:chipStock.mud[i],note:$('chip-note').value.trim(),time:now()});chipsPage();toast('换码成功，演示额度与记录已更新')}catch(e){$('chip-error').textContent=e.message}}
function queryChips(){let f={};for(let k of ['no','type','coin','start','end'])f[k]=$('cf-'+k).value.trim();if(f.start&&f.end&&f.start>f.end){$('cf-error').textContent='开始日期不能晚于结束日期';return}chipQuery=f;chipPageNo=1;$('cf-error').textContent='';renderChips()}
function filteredChips(){let f=chipQuery;return chipRows.filter(r=>(!f.no||r.no.includes(f.no))&&(f.type==='不限'||r.type===f.type)&&(f.coin==='不限'||r.coin===f.coin)&&reportInRange(r.time,f))}
function renderChips(){let rows=filteredChips(),size=Number($('chip-limit').value||50),pages=Math.max(1,Math.ceil(rows.length/size));chipPageNo=Math.min(chipPageNo,pages);$('chip-table').innerHTML=table(['序号','单号','账房','类型','币别','泥码(万)','现码(万)','额度(万)','操作人','确认人','备注','创建时间'],rows.slice((chipPageNo-1)*size,chipPageNo*size).map((r,i)=>'<tr>'+[(chipPageNo-1)*size+i+1,r.no,'WBYD',r.type,r.coin,fmt(r.mud),fmt(r.cash),fmt(r.sum),'admin','演示确认人',r.note||'—',r.time].map(x=>'<td>'+esc(String(x))+'</td>').join('')+'</tr>').join(''));$('chip-pager').innerHTML=compactPager(rows.length,chipPageNo,size,'chips',n=>{chipPageNo=n;renderChips()})}
function mudPage(){companyEnter('泥码管理');let f=mudQuery;$('main').innerHTML=`<div class="page-head"><h2>泥码交易</h2></div><div class="company-transfer-grid"><section class="card"><div class="card-body chip-entry">${field('户口号 *','<div class="inline"><input id="mud-account" value="WBYD"><button onclick="lookupMudAccount()" aria-label="查询户口">查询</button></div>')}${field('项目 *','<select id="mud-project" onchange="previewMudChange()"><option value="">请选择</option><option>现金换泥码</option><option>现码换泥码</option><option>泥码换现码</option></select>')}${field('币别 *',`<select id="mud-coin" onchange="previewMudChange()"><option value="">请选择</option>${opt(companyCurrencies,'')}</select>`)}${field('金额(万) *','<input id="mud-amount" oninput="previewMudChange()" inputmode="decimal" placeholder="请输入">')}${field('备注','<input id="mud-note" placeholder="请输入">')}<div id="mud-change-preview" class="hintline" aria-live="polite">请选择项目、币别并输入金额，查看银头变化。</div>${passwordFields('mudPwd')}<p id="mud-error" class="danger" role="alert"></p><div class="inline company-add"><button class="primary" onclick="mudPendingSubmit()">提交</button><button onclick="mudPage()">重置</button></div></div></section><section class="card"><div class="card-head"><h3>账房额度</h3></div><div id="mud-quota">${cashierQuota()}</div><div class="card-body"><small>账房备注：</small>${esc(companyProfile.note)||'—'}</div></section></div><div class="page-head" id="mudListHeading"><h2>泥码列表</h2><button onclick="printMudPreview()">打印预览</button></div><div class="card txn-filters report-filters">${field('户口号',`<input id="mf-account" value="${esc(f.account)}" placeholder="请输入">`)}${field('币别',`<select id="mf-coin">${opt(['不限',...companyCurrencies],f.coin)}</select>`)}${field('类型',`<select id="mf-type">${opt(['不限','现金换泥码','现码换泥码','泥码换现码'],f.type)}</select>`)}${field('后缀',`<select id="mf-suffix">${opt(['不限','A','B','O','N','S'],f.suffix)}</select>`)}${field('拆数',`<select id="mf-split">${opt(['不限','是','否'],f.split)}</select>`)}${field('月结',`<input id="mf-month" type="month" value="${f.month}">`)}<button class="primary" onclick="queryMud()">查询</button><button onclick="mudQuery={account:'',coin:'不限',type:'不限',suffix:'不限',split:'不限',month:''};mudPage()">重置</button></div><div id="mud-table" class="card report-table company-transfer-table"></div>`;renderMud()}

function mudPendingSubmit(){try{checkPasswords('mudPwd');let accountId=$('mud-account').value.trim(),type=$('mud-project').value,coin=$('mud-coin').value,i=companyCurrencies.indexOf(coin),amount=units($('mud-amount').value);if(accountId!=='WBYD')throw Error('请选择有效演示户口 WBYD');if(!['现金换泥码','现码换泥码','泥码换现码'].includes(type))throw Error('请选择项目');if(i<0)throw Error('请选择币别');if(amount<=0n)throw Error('金额须大于零');let cashBefore=companyBalance('WBYD',i),chipBefore=chipStock.cash[i],mudBefore=chipStock.mud[i];if(type==='现金换泥码'&&amount>cashBefore)throw Error('现金余额不足');if(type==='现码换泥码'&&amount>chipBefore)throw Error('现码余额不足');if(type==='泥码换现码'&&amount>mudBefore)throw Error('泥码余额不足');if(type==='现金换泥码'){companyFunds.WBYD[i]=fmt(cashBefore-amount);chipStock.mud[i]+=amount}else if(type==='现码换泥码'){chipStock.cash[i]-=amount;chipStock.mud[i]+=amount}else{chipStock.mud[i]-=amount;chipStock.cash[i]+=amount}mudRows.unshift({no:'J-DEMO'+String(mudSequence++).padStart(6,'0'),account:accountId,type,coin,amount:type==='泥码换现码'?-amount:amount,split:'否',suffix:'—',proposal:'—',roll:null,note:$('mud-note').value.trim(),time:now(),cashBefore,chipBefore,mudBefore,cashAfter:companyBalance('WBYD',i),chipAfter:chipStock.cash[i],mudAfter:chipStock.mud[i]});mudPage();toast('交易成功，余额与泥码记录已更新')}catch(e){$('mud-error').textContent=e.message}}

function listRows(){let {q,g,ca,r,st,hall,k}=appliedQuery;let match=(!q||[id(),account.name,account.phone].some(v=>v.includes(q)))&&(!g||account.code.includes(g))&&(!ca||account.card.includes(ca))&&(r==='所有角色'||r===account.role)&&(st==='所有状态'||st===(account.locked?'冻结':'正常'))&&(hall==='全部开户厅'||hall===(account.hall||'1F'));queryHasResults=match;$('listTable').innerHTML=currencySummaries(match,k)+card('户口列表',table(['户口号','组别','姓名','角色','介绍人','开户厅','状态',...coins.map(c=>names[c]+'(万)'),'存卡(万)','未还M卡(万)','操作人','创建时间','操作'],match?`<tr><td><button class="link account-link" onclick="detail()">${esc(id())}</button></td><td>${esc(account.code)}</td><td><span class="role-dot" style="background:${roleColors[account.role]||'#64748b'}"></span>${esc(account.name)} <small>${esc(account.alias)}</small></td><td>${roleTag()}</td><td>${esc(account.introducer||'无')}</td><td>${esc(account.hall||'1F')}</td><td><span class="account-status ${account.locked?'locked':''}"><i></i>${account.locked?'冻结':'正常'}</span></td>${coins.map(c=>creditCell(c,k)).join('')}<td class="num">${coins.map(c=>`<div>${esc(c)}：${fmt(balances[c].stored)}</div>`).join('')}</td><td class="num account-m-debt">${esc(debtText()).replaceAll(' / ','<br>')}</td><td>${esc(account.createdBy||'—')}</td><td>${esc(account.created||'—')}</td><td><button onclick="detail()">详情</button></td></tr>`:''),`<div class="inline"><small>查询结果：${match?1:0} 个户口</small><button onclick="exportCSV()" ${match?'':'disabled'}>导出数据</button></div>`)}
function exportCSV(){if(!queryHasResults){toast('当前筛选无数据可导出');return}let k=appliedQuery.k;let headers=['户口号','组别','姓名','角色','介绍人','开户厅','状态',...coins.map(c=>c+'(万，'+(k==='cash'?'现金余额':'存卡余额')+')'),...coins.map(c=>c+'存卡(万)'),'未还M卡(万)','操作人','创建时间'];let values=[id(),account.code,account.name,account.role,account.introducer||'无',account.hall||'1F',account.locked?'冻结':'正常',...coins.map(c=>fmt(balances[c][k])),...coins.map(c=>fmt(balances[c].stored)),debtText(),account.createdBy||'—',account.created||'—'];let csv='\uFEFF'+[headers,values].map(row=>row.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='户口管理_查询结果.csv';a.click();URL.revokeObjectURL(a.href);toast('已导出当前查询结果（CSV，可用 Excel 打开）')}

function exchange(){if(!allowAccountOperation())return;modal('换汇 · '+id(),`<div class="transfer-layout"><section class="transfer-entry"><h3 class="transfer-section-title">换汇信息</h3><div class="form-grid">${field('对手户口账户 *','<input id="fxCounterparty" placeholder="请输入对手户口账户" required>',true)}${field('转出币种',coinSelect('from','fxCurrencyChanged()'))}${field('转入币种',`<select id="to" onchange="fxCurrencyChanged()">${opt(coins,'CNY')}</select>`)}${field('转出金额（万） *',amountInput('fxA','updateFx()'))}${field('汇率 *','<input id="fxRate" placeholder="系统汇率" readonly aria-readonly="true">')}</div><div class="transfer-passwords"><h3 class="transfer-section-title">操作验证</h3>${passwordFields('fxPwd')}</div></section><section class="transfer-info"><h3 class="transfer-section-title">换汇演示结果</h3><div id="fxPreview" class="fx-result" aria-live="polite"><div class="empty">填写左侧金额后<br>自动显示换算过程与结果</div></div></section></div>`,()=>{checkPasswords('fxPwd');let other=$('fxCounterparty').value.trim();if(!other)throw Error('请输入对手户口账户');if(other.toLowerCase()===id().toLowerCase())throw Error('对手户口不能与本户口相同');let x=fxValue();commitCounterpartyExchange(x,other);closeModal();detail();toast('换汇成功，双方余额及四条资金流水已更新')},'确认换汇');$('modal').classList.add('transfer-dialog');fxCurrencyChanged()}
// Local fixture representing system settings; production reads the configured pair and operation rate.
const systemFxAlgorithms={};
function getSystemExchangeAlgorithm(from,to){return systemFxAlgorithms[from+'|'+to+'|mul']||'mul'}
const systemFxRates={'CNY|VND|mul':'3400','HKD|VND|mul':'3162','USD|VND|mul':'25000','VND|CNY|mul':'0.000294','VND|HKD|mul':'0.000316','VND|USD|mul':'0.000040','HKD|CNY|mul':'0.92','HKD|CNY|div':'1.08695652','CNY|HKD|mul':'1.08695652','CNY|HKD|div':'0.92','USD|HKD|mul':'7.8','USD|HKD|div':'0.12820513','HKD|USD|mul':'0.12820513','HKD|USD|div':'7.8','USD|CNY|mul':'7.176','USD|CNY|div':'0.1393534','CNY|USD|mul':'0.1393534','CNY|USD|div':'7.176'};
function getSystemExchangeRate(from,to){let value=systemFxRates[from+'|'+to+'|mul'];if(!value||Number(value)<=0)throw Error('系统未配置该币种对汇率，请联系管理员');return value}
function fxCurrencyChanged(){let key=$('from').value+'|'+$('to').value+'|'+'mul',v=systemFxRates[key];$('fxRate').value=v||'';let hint=$('fxRateSource');if(!hint){hint=document.createElement('small');hint.id='fxRateSource';hint.className='hint';$('fxRate').parentElement.appendChild(hint)}hint.textContent=v?'系统汇率，只读不可调整':'系统未配置该币种汇率，暂不可换汇';updateFx()}
function fxValue(){let f=$('from').value,t=$('to').value;if(f===t)throw Error('转出与转入币种不能相同');let a=units($('fxA').value),[r,scale]=rate(getSystemExchangeRate(f,t)),m=getSystemExchangeAlgorithm(f,t);if(a<=0n||r<=0n)throw Error('金额和汇率必须大于零');let b=m==='div'?a*scale/r:a*r/scale;if(b<=0n)throw Error('计算结果截断后为零，请检查输入');return{f,t,a,b,m}}
function updateFx(){try{let x=fxValue(),enough=x.a<=balances[x.f].cash;$('fxPreview').innerHTML=`<div class="recipient-box"><div class="recipient-box-title">换算过程</div><div class="recipient-box-body fx-formula">${fmt(x.a)} ${x.f}（万）<br>${x.m==='mul'?'×':'÷'} ${esc($('fxRate').value)}<br>= ${fmt(x.b)} ${x.t}（万）</div></div><div class="preview"><small>预计转入金额</small><strong>${fmt(x.b)} <small>${x.t}（万）</small></strong></div><div class="recipient-box"><div class="recipient-box-title">余额变化预览（万）</div>${table(['币种','当前余额','换汇后余额'],`<tr><td>${x.f}</td><td>${fmt(balances[x.f].cash)}</td><td class="${enough?'':'danger'}">${enough?fmt(balances[x.f].cash-x.a):'余额不足'}</td></tr><tr><td>${x.t}</td><td>${fmt(balances[x.t].cash)}</td><td>${fmt(balances[x.t].cash+x.b)}</td></tr>`)}</div>${enough?'':'<p class="feedback">转出币种现金余额不足，无法提交。</p>'}<p class="hint">结果保留四位小数，超出部分直接舍去。确认换汇后生效。</p>`}catch(e){$('fxPreview').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}

function transfer(){if(!allowAccountOperation())return;modal('转账 · '+id(),`<div class="transfer-layout"><section class="transfer-entry"><h3 class="transfer-section-title">转账信息</h3><div class="form-grid">${field('转出户口',`<input readonly value="${esc(id())} · ${esc(account.name)}">`,true)}${field('收款户口号 *','<input id="recipient" placeholder="请输入收款户口号" oninput="lookup()">',true)}<p id="lookupHint" class="hint span2" style="margin:0">输入收款户口号后，右侧自动显示户口资料。</p>${field('币种',coinSelect())}${field('转账金额 *',amountInput())}${field('备注（选填）','<textarea id="remark" placeholder="请输入备注（选填）"></textarea>',true)}</div><div class="transfer-passwords"><h3 class="transfer-section-title">操作验证</h3>${passwordFields('transferPwd')}</div></section><section class="transfer-info"><h3 class="transfer-section-title">收款户口信息</h3><div class="recipient-match" aria-live="polite"><div><span>户口名字</span><strong id="recipientName">—</strong></div><div><span>户口编号</span><strong id="recipientNumber">—</strong></div></div><div id="recipientInfo">${recipientInfo(null)}</div></section></div>`,()=>{checkPasswords('transferPwd');let r=recipients.find(x=>x.id===$('recipient').value.trim());if(!r)throw Error('请先输入可唯一匹配的演示户口号');let c=$('coin').value,a=units($('amount').value);if(a<=0n)throw Error('请输入大于零的金额');if(a>balances[c].cash)throw Error('现金余额不足');balances[c].cash-=a;r.cash+=a;r.balances[c]+=a;log('转账转出',c,-a,r.id+' '+r.name,$('remark').value.trim());txnHistory.unshift({no:'TX'+String(seq++).padStart(5,'0'),key:'recipient-'+r.id,account:r.id,name:r.name,role:r.role||'散客',type:'转账转入',coin:c,amount:a,balance:r.balances[c],recipient:r.id,remark:$('remark').value.trim(),time:now()});closeModal();detail();toast('已演示转给 '+r.name+'，金额 '+fmt(a)+' '+c)},'确认转账');$('modal').classList.add('transfer-dialog')}

function freezeModal(mode='freeze',selectedNo='',type='amount'){if(type==='account'){let unlocking=mode==='release';modal('冻结 / 解冻 · '+id(),`${freezeTypeSelect(mode,type)}${!unlocking?'<div class="account-freeze-warning" role="alert">⚠ 整个户口状态将被标记为「冻结」，所有操作均受限制</div>':''}<div class="preview"><small>当前账户状态</small><strong>${account.locked?'冻结':'正常'}</strong><p>${unlocking?'解冻账户后状态恢复正常，已有指定币种冻结金额保持不变。':'冻结整个账户后状态变为冻结，各币种现金余额及已冻结金额保持不变。'}</p></div><div style="margin-top:16px">${field('备注（选填）','<textarea id="lockRemark" placeholder="请输入备注（选填）"></textarea>')}</div>`,()=>{if(unlocking&&!account.locked)throw Error('当前账户未冻结');if(!unlocking&&account.locked)throw Error('当前账户已冻结，请勿重复冻结');let remark=$('lockRemark').value.trim();if(unlocking){let record=accountLocks.find(x=>!x.released);if(!record)throw Error('未找到有效的整户冻结记录');record.released=now();record.releaseRemark=remark;account.locked=false}else{account.locked=true;accountLocks.unshift({no:'LK'+String(seq++).padStart(4,'0'),time:now(),remark,released:null})}recordFreezeEvent(unlocking?'解冻账户':'冻结账户','',0n,0n,unlocking?'冻结':'正常',unlocking?'正常':'冻结',remark);audit.unshift({type:unlocking?'解冻账户':'整户冻结',text:id()+' '+remark,time:now()});closeModal();detail();toast(unlocking?'账户已解冻，状态已恢复正常':'账户已冻结')},unlocking?'确认解冻账户':'确认冻结账户')}else{amountFreezeModal(mode,selectedNo);$('modalBody').insertAdjacentHTML('afterbegin',freezeTypeSelect(mode,type))}}

function amountFreezeModal(mode='freeze',selectedNo=''){let active=freezes.filter(f=>f.remaining>0n);modal('冻结 / 解冻 · '+id(),`<div class="form-grid">${field('币种',coinSelect('coin','freezePreview()'))}${mode==='freeze'?field('冻结金额（万） *',amountInput('amount','freezePreview()')):field('解冻金额（万）','<input id="releaseTotal" readonly>')}${field('备注（选填）','<textarea id="reason" placeholder="请输入备注（选填）"></textarea>',true)}</div><div class="preview" id="freezePreview">冻结会直接扣减现金余额；解冻恢复对应现金。</div><input type="hidden" id="freezeMode" value="${mode}">`,()=>{let a=mode==='release'?balances[$('coin').value].frozen:units($('amount').value),why=$('reason').value.trim();if(a<=0n)throw Error(mode==='release'?'该币种暂无可解冻金额':'金额必须大于零');if(mode==='freeze'){let c=$('coin').value;if(a>balances[c].cash)throw Error('现金余额不足，不能冻结');balances[c].cash-=a;balances[c].frozen+=a;freezes.unshift({no:'FZ'+String(seq++).padStart(4,'0'),coin:c,total:a,remaining:a,why,time:now(),releases:[]});log('冻结',c,-a);recordFreezeEvent('冻结',c,a,balances[c].frozen,'','',why)}else{let c=$('coin').value;if(a>balances[c].frozen)throw Error('该币种冻结余额不足');let remaining=a,stamp=now(),releaseNo='UF'+String(seq++).padStart(4,'0');for(let f of [...freezes].reverse()){if(f.coin!==c||f.remaining<=0n||remaining<=0n)continue;let used=f.remaining<remaining?f.remaining:remaining;f.remaining-=used;f.releases.push({a:used,why,time:stamp,no:releaseNo});remaining-=used}balances[c].cash+=a;balances[c].frozen-=a;log('解冻',c,a,releaseNo);recordFreezeEvent('解冻',c,a,balances[c].frozen,'','',why)}closeModal();detail();toast(mode==='freeze'?'冻结成功，现金余额已扣减':'解冻成功，现金余额已恢复')},mode==='freeze'?'确认冻结':'确认解冻');let source=freezes.find(f=>f.no===selectedNo);if(source)$('coin').value=source.coin;freezePreview()}
function freezePreview(){let mode=$('freezeMode').value,c=$('coin').value,b=balances[c];let head=`<small>当前现金 ${fmt(b.cash)} ${c}（万）</small><p>当前冻结余额：${fmt(b.frozen)} ${c}（万）</p>`;try{let a=mode==='release'?b.frozen:units($('amount').value);if(mode==='release')$('releaseTotal').value=fmt(a);if(a<=0n)throw Error(mode==='release'?'该币种暂无可解冻金额':'请输入大于零的金额');if(mode==='release'&&a>b.frozen)throw Error('该币种冻结余额不足');if(mode==='freeze'&&a>b.cash)throw Error('现金余额不足');$('freezePreview').innerHTML=head+`<strong>操作后现金 ${fmt(b.cash+(mode==='freeze'?-a:a))}</strong><small>操作后冻结 ${fmt(b.frozen+(mode==='freeze'?a:-a))} ${c}（万）</small>`}catch(e){$('freezePreview').innerHTML=head+`<p class="hint">${esc(e.message)}</p>`}}
let freezeEvents=[],freezeAccountKey=1,freezeAccountSeq=1,freezeIdentities={},freezeReportTab='amount',freezeQuery={q:'',type:'全部',start:'',end:''};

let formPhotos=[],audit=[];
function accountForm(fresh){let a=fresh?{code:'',number:'',name:'',alias:'',role:'散客',area:'+86',phone:'',card:'',old:false,oldId:'',oldNote:''}:account;formPhotos=[...(fresh?[]:account.photos)];accountDocDraft={...(fresh?{}:account.documents||{})};$('pageTitle').textContent=fresh?'开户':'编辑户口';$('main').innerHTML=`<div class="page-head"><h2>${fresh?'开户':'编辑户口 · '+esc(id())}</h2><button onclick="detail()">返回详情</button></div><section class="card account-form"><div class="form-section"><h3>户口信息</h3><div class="form-grid">${field('组别代码 *',`<input id="aCode" value="${esc(a.code)}" >`)}${field('户口编号 *',`<input id="aNum" value="${esc(a.number)}" >`)}${field('姓名 *',`<input id="aName" value="${esc(a.name)}">`)}${field('别名',`<input id="aAlias" value="${esc(a.alias)}">`)}${field('角色 *',`<select id="aRole">${opt(['股东线','市场线','代理线','公司线','散客'],a.role)}</select>`)}${field('会员卡号 *',`<input id="aCard" value="${esc(a.card)}" placeholder="请输入会员卡号">`)}${field('上线户口',`<input id="aUpstream" value="${esc(a.upstream||'')}" placeholder="请输入上线户口">`)}${field('介绍人',`<input id="aIntroducer" value="${esc(a.introducer==='无'?'':a.introducer||'')}" placeholder="请输入介绍人">`)}${field('开户厅',`<select id="aHall">${opt(['1F','2F','3H'],a.hall||'1F')}</select>`)}</div></div><div class="form-section"><h3>联系资料</h3><div class="form-grid">${field('区号 *',`<input id="aArea" type="tel" inputmode="tel" autocomplete="tel-country-code" value="${esc(a.area)}" placeholder="请输入区号，如 +86" oninput="clearPhoneFeedback()" onblur="this.value=normalizePhoneArea(this.value);validateAccountPhone()">`)}${field('手机号 *',`<input id="aPhone" type="tel" inputmode="tel" autocomplete="tel-national" aria-describedby="phoneHint" value="${esc(a.phone)}" placeholder="请输入手机号，不含区号" onblur="validateAccountPhone()" oninput="clearPhoneFeedback()"><small id="phoneHint" role="status" class="hint">按输入区号校验手机号格式，无需验证码</small>`)}${field('备用电话1',`<input id="aBackup1" value="${esc(a.backup1||'')}" placeholder="选填">`)}${field('备用电话2',`<input id="aBackup2" value="${esc(a.backup2||'')}" placeholder="选填">`)}${field('电子邮箱',`<input id="aEmail" type="email" value="${esc(a.email||'')}" placeholder="选填">`)}${field('短信语言',`<select id="aLanguage">${opt(['中文','英文'],a.language||'中文')}</select>`)}</div></div><div class="form-section"><h3>会员资料与证件</h3><div class="form-grid">${field('国籍',`<input id="aNationality" value="${esc(a.nationality||'')}" placeholder="选填">`)}${field('性别',`<select id="aGender">${opt(['未填写','男','女'],a.gender||'未填写')}</select>`)}${field('生日',`<input id="aBirthday" type="date" value="${esc(a.birthday||'')}">`)}${field('证件类型',`<select id="aIdType">${opt(['未选择','身份证','护照','其他'],a.idType||'未选择')}</select>`)}${field('证件号码',`<input id="aIdNumber" value="${esc(a.idNumber||'')}" placeholder="选填">`)}<div class="span2 upload"><label>照片信息 *（1–2 张）<input type="file" accept="image/png,image/jpeg,image/webp" multiple onchange="addPhotos(this)"></label><div id="photoList"></div><p class="hint">图片仅在当前页面预览，不上传。最多两张，PNG / JPG / WebP，每张不超过 10 MB。</p></div></div></div><div class="form-section"><h3>备注</h3><div class="form-grid">${field('内部备注（选填）',`<textarea id="aInternalNote" placeholder="请输入内部备注">${esc(a.internalNote||'')}</textarea><small class="hint">仅该部门人员可见</small>`)}${field('公开备注（选填）',`<textarea id="aPublicNote" placeholder="请输入公开备注">${esc(a.publicNote??a.clientNote??'')}</textarea><small class="hint">全公司有账号的人员均可见</small>`)}</div></div><div class="form-section"><h3>操作验证</h3>${passwordFields('accountPwd')}</div><div class="sticky-actions"><span id="formError" class="feedback" role="alert"></span><button onclick="detail()">取消</button><button class="primary" onclick="saveAccount(${fresh})">${fresh?'确认开户':'保存户口'}</button></div></section>`;photoList();window.scrollTo(0,0)}
let accountDocDraft={};
function accountDocField(key,title){let p=accountDocDraft[key];return field(title+'（选填）',`<input type="file" accept="image/png,image/jpeg,image/webp" onchange="accountDocUpload('${key}',this)"><div id="doc_${key}">${p?`<img src="${esc(p.url)}" alt="${title}" style="height:60px;margin-top:8px"><small>${esc(p.name)}</small>`:''}</div>`)}
function accountDocUpload(key,input){let f=input.files[0];if(!f)return;if(!['image/png','image/jpeg','image/webp'].includes(f.type)||f.size>10*1024*1024){$('formError').textContent='请上传不超过10MB的 PNG、JPG 或 WebP 图片';input.value='';return}accountDocDraft[key]={name:f.name,url:URL.createObjectURL(f)};$('doc_'+key).innerHTML=`<img src="${accountDocDraft[key].url}" alt="证件预览" style="height:60px;margin-top:8px"><small>${esc(f.name)}</small>`}
function readAccountExtras(){let keys={upstream:'aUpstream',introducer:'aIntroducer',hall:'aHall',backup1:'aBackup1',backup2:'aBackup2',email:'aEmail',language:'aLanguage',nationality:'aNationality',gender:'aGender',birthday:'aBirthday',idType:'aIdType',idNumber:'aIdNumber',internalNote:'aInternalNote',publicNote:'aPublicNote'};return {...Object.fromEntries(Object.entries(keys).map(([k,id])=>[k,$(id).value.trim()])),internalNoteDepartment:account.internalNoteDepartment||'场面',internalNoteScope:'department',publicNoteScope:'company_accounts'}}
function addPhotos(input){let files=[...input.files];$('formError').textContent='';if(formPhotos.length+files.length>2){$('formError').textContent='照片信息最多上传两张，请先移除已有照片后再上传';input.value='';return}for(let f of files){if(!['image/png','image/jpeg','image/webp'].includes(f.type)||f.size>10*1024*1024){$('formError').textContent='图片格式或大小不符合要求';input.value='';return}}for(let f of files)formPhotos.push({name:f.name,url:URL.createObjectURL(f)});input.value='';photoList()}
function photoList(){$('photoList').innerHTML=formPhotos.map((p,i)=>`<span class="thumb"><img alt="会员卡预览" src="${p.url}">${esc(p.name)}<button onclick="formPhotos.splice(${i},1);photoList()">移除</button></span>`).join('')}
function normalizePhoneArea(area){let value=area.trim();return /^\d{1,3}$/.test(value)?'+'+value:value}
function phoneFormatError(area,phone){area=normalizePhoneArea(area);let lengths={'+86':11,'+852':8,'+853':8,'+886':9,'+84':9,'+65':8};if(!phone)return '请输入手机号';if(!/^\+[1-9]\d{0,2}$/.test(area))return '请输入有效区号，如 +86（1–3位数字）';if(!/^\d+$/.test(phone))return '手机号仅支持数字，请勿重复填写区号或输入空格、字母、符号';if(lengths[area]&&phone.length!==lengths[area])return area+' 手机号须为 '+lengths[area]+' 位数字（不含区号）';if(area.length-1+phone.length>15)return '区号与手机号合计不能超过15位数字';if(area==='+86'&&!/^1[3-9]\d{9}$/.test(phone))return '+86 手机号须为1开头、第二位3–9的11位数字';return ''}
function validateAccountPhone(){let message=phoneFormatError($('aArea').value,$('aPhone').value.trim()),input=$('aPhone'),hint=$('phoneHint');input.setAttribute('aria-invalid',message?'true':'false');input.style.borderColor=message?'#dc3545':'';hint.textContent=message||'手机号格式正确';hint.style.color=message?'#c62828':'#23834a';return !message}
function clearPhoneFeedback(){$('aPhone').setAttribute('aria-invalid','false');$('aPhone').style.borderColor='';$('phoneHint').textContent='按输入区号校验手机号格式，无需验证码';$('phoneHint').style.color=''}
function saveAccount(fresh){try{if(!formPhotos.length)throw Error('请至少上传一张照片');if(formPhotos.length>2)throw Error('照片信息最多上传两张');checkPasswords('accountPwd');let name=$('aName').value.trim(),phone=$('aPhone').value.trim(),area=normalizePhoneArea($('aArea').value),code=$('aCode').value.trim(),number=$('aNum').value.trim();if(!name||!code||!number||!$('aCard').value.trim())throw Error('请填写姓名、组别、编号、会员卡号');if(!/^[A-Za-z0-9]+$/.test(code+number))throw Error('演示组别与编号仅支持字母和数字');if(recipients.some(r=>r.id===code+number))throw Error('户口号已存在');if(!validateAccountPhone()){$('aPhone').focus();throw Error($('phoneHint').textContent)}account={...account,code,number,name,alias:$('aAlias').value.trim(),role:$('aRole').value,area,phone,card:$('aCard').value.trim(),photos:[...formPhotos],...readAccountExtras(),documents:{...accountDocDraft}};if(fresh){account.advanceChanges=[];account.pointsAvailable=0;account.pointsRedeemed=0;account.pointsExpiring30Days=0;account.created=now();account.createdBy='admin';freezeAccountKey=++freezeAccountSeq;financeOpenedAccounts.push({key:freezeAccountKey,created:now()});balances=Object.fromEntries(coins.map(c=>[c,{cash:0n,stored:0n,frozen:0n}]));freezes=[];ledger=[];notes=[];rateConfigs={};account.auth='尚未设置授权人';account.authorizedPeople=[];account.locked=false;accountLocks=[];account.isNew=true;approval=null}freezeIdentities[freezeAccountKey]={number:id(),name:account.name};audit.unshift({type:fresh?'新开户':'编辑户口资料',text:id(),time:now()});detail();toast('户口资料已保存到当前演示会话')}catch(e){$('formError').textContent=e.message}}
function approvalModal(){modal('组别 / 编号变更审批',`<div class="notice">以下为审批状态演示；正式系统须校验最高授权人权限，授权名单及自审规则待确认。</div>${approval?`<p>状态：${esc(approval.status)} · ${esc(approval.code+approval.number)}</p><p>原因：${esc(approval.reason)}</p>${approval.status==='待审批'?'<div class="inline"><button onclick="decideApproval(true)">演示最高授权人同意</button><button onclick="decideApproval(false)">演示最高授权人拒绝</button></div>':''}`:''}<div class="form-grid" style="margin-top:16px">${field('新组别代码',`<input id="newCode" value="${esc(account.code)}">`)}${field('新户口编号',`<input id="newNum" value="${esc(account.number)}">`)}${field('申请原因 *','<textarea id="appReason"></textarea>',true)}</div>`,()=>{let code=$('newCode').value.trim(),number=$('newNum').value.trim(),reason=$('appReason').value.trim();if(!/^[A-Za-z0-9]+$/.test(code)||!/^[A-Za-z0-9]+$/.test(number)||!reason)throw Error('请填写有效组别、编号及原因');if(code+number===id())throw Error('申请内容没有变化');if(recipients.some(r=>r.id===code+number))throw Error('户口号已存在');approval={code,number,reason,status:'待审批'};audit.unshift({type:'提交编号变更申请',text:id()+' → '+code+number,time:now()});approvalModal()},'提交审批')}
function decideApproval(yes){try{checkPasswords('actionPwd')}catch(e){$('error').textContent=e.message;return}if(!approval||approval.status!=='待审批')return;approval.status=yes?'已同意':'已拒绝';if(yes){account.code=approval.code;account.number=approval.number}audit.unshift({type:'模拟最高授权人'+approval.status,text:approval.code+approval.number,time:now()});closeModal();detail();toast(yes?'审批同意，新组别和编号已生效':'审批拒绝，原编号保留')}
const rateFields=['占成比','对应码粮比'];
function personalRate(c,mode){let r=rateConfigs[c];return r?.[mode]?.values||(r?.mode===mode?r.values:['',''])}
function rateSummary(){return table(['币种','结算方式','占成比','对应码粮比'],coins.flatMap(c=>['即结','月结'].map(mode=>`<tr><td>${c}</td><td>${mode}</td>${personalRate(c,mode).map(v=>`<td>${v!==''?esc(v)+'%':'角色默认'}</td>`).join('')}</tr>`)).join(''))}
function rates(){modal('个人码粮设置 · '+id(),`<p class="hint">即结与月结分别设置，同时保留。留空沿用角色默认，0 表示明确为零。</p><div class="table-wrap"><table class="rate-matrix"><thead><tr><th>币种</th><th>结算方式</th><th>占成比 (%)</th><th>对应码粮比 (%)</th></tr></thead><tbody>${coins.flatMap(c=>['即结','月结'].map((mode,j)=>`<tr><td>${c}</td><td>${mode}</td>${personalRate(c,mode).map((v,i)=>`<td><input id="rate_${c}_${j}_${i}" aria-label="${c} ${mode} ${rateFields[i]}" value="${esc(v)}" placeholder="角色默认" inputmode="decimal"></td>`).join('')}</tr>`)).join('')}</tbody></table></div>${passwordFields('personalRatePwd')}`,()=>{checkPasswords('personalRatePwd');let next={};for(let c of coins){next[c]={};for(let [j,mode] of ['即结','月结'].entries()){let values=[0,1].map(i=>$('rate_'+c+'_'+j+'_'+i).value.trim());for(let v of values)if(v!==''&&(!/^\d+(\.\d{1,4})?$/.test(v)||Number(v)>100))throw Error(c+' '+mode+'：比例须为0–100，最多四位小数');next[c][mode]={values}}}rateConfigs=next;audit.unshift({type:'个人码粮设置',text:'分别保存即结与月结比例',time:now()});closeModal();detail();toast('即结与月结配置已保存')},'保存全部配置');$('modal').classList.add('rates-dialog')}

let authDraft=[];
const authTypes=['取款','出佣金','消费','订务','签贷款','数据查询','开工'];
function blankAuth(){return {name:'',area:'+86',phone:'',types:[],card:'',photo:null,remark:''}}
function authorizedSummary(){let people=account.authorizedPeople||[];if(!people.length)return '<div class="card-body"><span class="muted">尚未设置授权人</span></div>';return `<div class="auth-summary">${people.map((x,i)=>`<article class="auth-summary-person">${x.photo?`<button class="auth-photo-button" onclick="previewAuthPhoto(${i})" aria-label="查看${esc(x.name)}的照片"><img src="${esc(x.photo.url)}" alt="${esc(x.name)}的照片" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><span hidden>图片加载失败</span></button>`:''}<div class="auth-summary-info"><div class="auth-summary-name"><strong>${esc(x.name)}</strong><small>授权人 ${i+1}</small></div><div class="auth-summary-fields"><span><small>电话</small> ${x.phone?esc((x.area?x.area+' ':'')+x.phone):'未填写'}</span><span><small>会员卡号</small> ${esc(x.card)||'未填写'}</span></div><div class="auth-permissions">${x.types.length?x.types.map(t=>`<span>${esc(t)}</span>`).join(''):'<small>未设置授权种类</small>'}</div>${x.remark?`<p class="auth-summary-remark"><small>备注</small> ${esc(x.remark)}</p>`:''}</div></article>`).join('')}</div>`}
function previewAuthPhoto(i){let x=account.authorizedPeople?.[i];if(!x?.photo)return;modal('授权人照片 · '+x.name,`<img src="${esc(x.photo.url)}" alt="${esc(x.name)}的照片" style="width:100%;max-height:60vh;object-fit:contain"><p class="hint">${esc(x.photo.name)}</p>`,null);$('modalFoot').innerHTML='<button onclick="closeModal()">关闭</button>'}
function authModal(){authDraft=(account.authorizedPeople||[]).map(x=>({...x,types:[...(x.types||[])]}));if(!authDraft.length)authDraft=[blankAuth()];modal('编辑授权人',`<div id="authRows"></div><button onclick="addAuthRow()" style="margin:10px 0 16px">＋ 新增授权人</button><div class="form-grid" style="padding-top:16px;border-top:1px solid var(--line)">${field('操作人密码 *','<input id="authOperatorPassword" type="password" autocomplete="off" placeholder="请输入操作人密码">')}${field('确认人密码 *','<input id="authConfirmPassword" type="password" autocomplete="off" placeholder="请输入确认人密码">')}</div>`,saveAuth);renderAuthRows()}
function renderAuthRows(){$('authRows').innerHTML=authDraft.map((x,i)=>`<section class="auth-person"><div class="inline" style="justify-content:space-between;margin-bottom:12px"><strong>授权人 ${i+1}</strong><button class="danger" onclick="authDraft.splice(${i},1);renderAuthRows()">移除</button></div><div class="auth-three">${field('姓名 *',`<input value="${esc(x.name)}" oninput="authDraft[${i}].name=this.value">`)}${field('区号',`<input value="${esc(x.area)}" oninput="authDraft[${i}].area=this.value">`)}${field('电话',`<input value="${esc(x.phone)}" placeholder="电话" oninput="authDraft[${i}].phone=this.value">`)}</div><label style="margin:12px 0 5px">授权种类</label><div class="inline" style="gap:10px">${authTypes.map((t,j)=>`<label><input type="checkbox" ${x.types.includes(t)?'checked':''} onchange="setAuthType(${i},${j},this.checked)">${t}</label>`).join('')}</div><div class="form-grid" style="margin-top:12px">${field('会员卡号',`<input value="${esc(x.card)}" oninput="authDraft[${i}].card=this.value">`)}${field('照片',`<input type="file" accept="image/png,image/jpeg,image/webp" onchange="authPhoto(${i},this)"><div id="authPhoto_${i}">${authPhotoMarkup(x.photo)}</div>`)}${field('备注（选填）',`<input value="${esc(x.remark)}" placeholder="手打备注（可选）" oninput="authDraft[${i}].remark=this.value">`,true)}</div></section>`).join('')||'<div class="empty">暂无授权人，可点击新增授权人。</div>'}
function authPhotoMarkup(p){return p?`<img src="${esc(p.url)}" alt="授权人照片" style="height:60px;max-width:140px;object-fit:contain;margin-top:8px"><small> ${esc(p.name)}</small>`:''}
function addAuthRow(){authDraft.push(blankAuth());renderAuthRows()}
function setAuthType(i,j,on){let t=authTypes[j];authDraft[i].types=on?[...new Set([...authDraft[i].types,t])]:authDraft[i].types.filter(v=>v!==t)}
function authPhoto(i,input){let f=input.files[0];if(!f)return;if(!['image/png','image/jpeg','image/webp'].includes(f.type)||f.size>10*1024*1024){$('error').textContent='请上传不超过10MB的 PNG、JPG 或 WebP 图片';input.value='';return}authDraft[i].photo={name:f.name,url:URL.createObjectURL(f)};$('authPhoto_'+i).innerHTML=authPhotoMarkup(authDraft[i].photo);$('error').textContent=''}
function saveAuth(){for(let [i,x] of authDraft.entries())if(!x.name.trim())throw Error('请填写授权人 '+(i+1)+' 的姓名');let op=$('authOperatorPassword').value,cf=$('authConfirmPassword').value;if(!op.trim())throw Error('请输入操作人密码');if(!cf.trim())throw Error('请输入确认人密码');if(op===cf)throw Error('操作人密码与确认人密码不可相同');account.authorizedPeople=authDraft.map(x=>({...x,name:x.name.trim(),types:[...x.types]}));account.auth=account.authorizedPeople.map(x=>x.name).join('、')||'尚未设置授权人';$('authOperatorPassword').value='';$('authConfirmPassword').value='';audit.unshift({type:'修改授权人',text:'保存 '+authDraft.length+' 位授权人',time:now()});closeModal();detail();toast('授权人已保存')}
function scopeName(n){return n.scope==='all'?'所有人可见':n.scope==='internal'?'内部（仅同部门可见）':'指定人员：'+(n.people||[]).join('、')}
function noteVersions(n){return [{...n,time:n.edited||n.created},...(n.history||[])].map(v=>`<div style="padding:9px 0;border-bottom:1px solid var(--line)"><p style="white-space:pre-wrap">${esc(v.text)}</p><small>${esc(v.department||'场面')} · ${esc(scopeName(v))} · admin · ${esc(v.time)}</small></div>`).join('')}
function noteTimeline(){return `<section class="note-log"><h3>备注记录 <small>（${notes.length}）</small></h3><div class="note-log-scroll"><ol class="note-timeline">${notes.map((r,j)=>({r,j})).sort((a,b)=>(b.r.edited||b.r.created).localeCompare(a.r.edited||a.r.created)).map(({r,j})=>`<li><div class="note-log-meta"><time>${esc(r.edited||r.created)}</time><span>操作人：${esc(r.edited?(r.editor||'admin'):r.author)}</span><span>${r.edited?'修改备注':'新增备注'}</span></div><p class="note-log-text">${esc(r.text)}</p><small>部门：${esc(r.department||'场面')}　可见范围：${esc(scopeName(r))}</small><div class="note-log-actions"><button class="link" onclick="noteModal(${j})">编辑</button><details><summary>修改记录</summary><small>创建人：${esc(r.author)}　创建时间：${esc(r.created)}${r.edited?'　最近编辑时间：'+esc(r.edited):''}</small>${noteVersions(r)}</details></div></li>`).join('')}</ol>${notes.length?'':'<div class="empty">暂无备注</div>'}</div></section>`}
function noteModal(i){let n=notes[i]||{text:'',department:'场面',scope:'internal',people:[]};modal('户口备注管理',`<section style="background:#f9fafb;border:1px solid var(--line);border-radius:7px;padding:13px"><h3 style="font-size:14px;margin-bottom:8px">${i===undefined?'新增备注':'编辑备注'}</h3>${field('部门',`<select id="noteDepartment">${opt(['场面'],n.department||'场面')}</select>`)}<div style="margin-top:10px">${field('可见范围',`<select id="noteScope" onchange="$('people').hidden=this.value!=='specific'"><option value="internal" ${n.scope==='internal'?'selected':''}>内部（仅同部门可见）</option><option value="all" ${n.scope==='all'?'selected':''}>所有人可见</option><option value="specific" ${n.scope==='specific'?'selected':''}>指定人员可见</option></select>`)}</div><div id="people" class="inline" style="margin-top:8px" ${n.scope==='specific'?'':'hidden'}>${['账房主管','客服甲','财务乙'].map(p=>`<label><input type="checkbox" name="person" value="${p}" ${(n.people||[]).includes(p)?'checked':''}>${p}</label>`).join('')}</div><textarea aria-label="备注内容" id="noteText" style="margin-top:8px;min-height:66px" placeholder="请输入备注内容（选填）...">${esc(n.text)}</textarea>${passwordFields('notePwd')}<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:10px">${i===undefined?'':'<button onclick="noteModal()">取消编辑</button>'}<button class="primary" onclick="saveNote(${i===undefined?'undefined':i})">${i===undefined?'添加':'保存修改'}</button></div></section><p class="hint">演示部门取自截图；正式部门选项沿用后台部门配置。当前为管理员演示视图。</p>${noteTimeline()}`,null);$('modalFoot').innerHTML='<button onclick="closeModal()">关闭</button>'}
function saveNote(i){try{checkPasswords('notePwd');let text=$('noteText').value.trim(),department=$('noteDepartment').value,scope=$('noteScope').value,people=scope==='specific'?[...document.querySelectorAll('[name=person]:checked')].map(e=>e.value):[];if(!department)throw Error('请选择部门');if(scope==='specific'&&!people.length)throw Error('请选择至少一位可见人员');let t=now();if(i===undefined)notes.unshift({text,department,scope,people,created:t,edited:null,author:'admin',history:[]});else{let previous=notes[i];previous.history=previous.history||[];previous.history.unshift({text:previous.text,department:previous.department||'场面',scope:previous.scope,people:[...(previous.people||[])],time:previous.edited||previous.created});Object.assign(previous,{text,department,scope,people,edited:t})}audit.unshift({type:i===undefined?'新增备注':'编辑备注',text:'部门：'+department+'；'+scopeName({scope,people}),time:t});detail();noteModal();toast(i===undefined?'备注已添加':'备注已修改')}catch(e){$('error').textContent=e.message}}
function noteHistory(i){let n=notes[i];modal('备注修改记录',noteVersions(n),null)}
function logs(){activeNav('操作日志');$('pageTitle').textContent='操作日志';$('main').innerHTML=card('资料与设置操作',table(['动作','内容','操作人','时间'],audit.map(a=>`<tr><td>${esc(a.type)}</td><td>${esc(a.text)}</td><td>admin</td><td>${a.time}</td></tr>`).join('')))+card('资金操作',ledgerTable())}
function help(){modal('原型说明 / 评审边界',`<p>本文件沿用现有后台的深色导航、蓝色按钮和白色表格布局，提供户口管理调整的可点击演示。</p><div class="notice" style="margin-top:16px">全部为虚构数据，仅保存在页面内存。刷新恢复初始状态；不连接真实后台，不上传图片或提交资金业务。</div><p>建议体验：编辑 / 开户 → 个人码粮设置 → 冻结 → 冻结列表解冻 → 换汇 → 转账 → 备注与审批。</p><p style="margin-top:12px">已确认：冻结直接扣减现金余额；解冻恢复现金；结算周期为即结和月结。</p><p style="margin-top:12px">待确认：金额精度对应元还是万、存卡交收转换规则、角色与佣金公式、会员卡绑定规则、最高审批权限、手机号各地区完整规则、部分解冻和可见人员范围。</p><p class="hint">演示沿用现界面“万”单位并截断至四位小数；部分解冻可体验但不代表已确认业务。非本次范围的菜单保留入口说明。</p>`,null)}
function activeNav(title){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('selected',b.textContent===title));document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',[...b.childNodes].filter(n=>n.nodeType===3).map(n=>n.textContent).join('').trim()===(title==='户口详情'?'户口管理':title)))}
window.addEventListener?.('resize',measureDetailNotes);

function toggleLoginPassword(){let input=$('loginPassword'),shown=input.type==='password';input.type=shown?'text':'password';$('loginVisibility').textContent=shown?'隐藏':'显示';$('loginVisibility').setAttribute('aria-label',shown?'隐藏密码':'显示密码')}
function submitLogin(event){event.preventDefault();let name=$('loginUser').value.trim(),password=$('loginPassword').value;if(name!=='admin'||password!=='123456'){$('loginError').textContent='账号或密码错误，请使用下方演示账号';$('loginPassword').value='';$('loginPassword').focus();return}document.body.classList.remove('login-mode');document.querySelector('aside').inert=false;document.querySelector('.layout').inert=false;$('loginPassword').value='';$('loginError').textContent='';$('loginPassword').type='password';$('loginVisibility').textContent='显示';if(typeof openSessions==='function')openSessions();else showList();document.querySelector('.nav button')?.focus()}
function logoutPrototype(){document.querySelectorAll('dialog[open]').forEach(d=>d.close());document.body.classList.add('login-mode');document.querySelector('aside').inert=true;document.querySelector('.layout').inert=true;$('loginPassword').value='';$('loginPassword').type='password';$('loginVisibility').textContent='显示';$('loginVisibility').setAttribute('aria-label','显示密码');$('loginError').textContent='';$('loginUser').value='';$('loginUser').focus()}


let sessionReady=false,sessionPending=null,sessionIdentity=id(),sessionCreditUse={},accountSaveInProgress=false;
function accountSessionSnapshot(){return {id:id(),previousId:sessionIdentity,name:account.name,card:account.card,locked:!!account.locked,rateConfigs:JSON.parse(JSON.stringify(rateConfigs)),role:account.role,cash:Object.fromEntries(coins.map(c=>[c,balances[c].cash])),stored:Object.fromEntries(coins.map(c=>[c,balances[c].stored])),credit:Object.fromEntries(coins.map(c=>[c,creditInfo(c)?.available||0n]))}}
function syncSessionAccount(){if(!sessionReady)return;$('sessionFrame').contentWindow.sessionBridge.sync(accountSessionSnapshot());sessionIdentity=id()}
function sessionTitleChanged(t){if(document.body.classList.contains('session-mode'))$('pageTitle').textContent=t}
function sessionModuleReady(){sessionReady=true;syncSessionAccount();if(sessionPending){let p=sessionPending;sessionPending=null;openSessions(p.action,p.value)}}
function openSessions(action='list',value=''){if($('modal').open)closeModal();document.body.classList.add('session-mode');window.scrollTo(0,0);document.querySelector('.layout')?.scrollTo?.(0,0);activeNav(action==='settings'?'佣金占成设置':'开工管理');$('pageTitle').textContent=action==='open'?'新开工':action==='settings'?'佣金占成设置':'开工管理';if(!sessionReady){sessionPending={action,value};return}syncSessionAccount();$('sessionFrame').contentWindow.sessionBridge.navigate(action,value)}
function startAccountSession(){if(!allowAccountOperation())return;openSessions('open',id())}
function leaveSessions(){document.body.classList.remove('session-mode')}
function accountSessionTable(){let rows=sessionReady?$('sessionFrame').contentWindow.sessionBridge.records(id()):[];return table(['场次号','类型','币种','本金(万)','转码(万)','状态','开工时间','操作'],rows.map(s=>`<tr><td>${esc(s.id)}</td><td>${esc(s.type)}</td><td>${s.cur}</td><td>${fmt(s.initial)}</td><td>${fmt(s.roll)}</td><td>${esc(s.status)}</td><td>${esc(s.opened)}</td><td><button class="link" onclick="openSessions('detail','${esc(s.id)}')">查看</button></td></tr>`).join(''))}
function sessionAccountChanged(a){if(a.id!==id())return;for(let c of coins){let cashDelta=(a.cash?.[c]??balances[c].cash)-balances[c].cash;if(cashDelta!==0n){balances[c].cash+=cashDelta;log(cashDelta<0n?'取款':'存款',c,cashDelta,'',a.operation+' · '+a.session+'（现金余额）')}let available=creditInfo(c)?.available||0n;sessionCreditUse[c]=(sessionCreditUse[c]||0n)+available-a.credit[c];let delta=a.stored[c]-balances[c].stored;if(delta!==0n&&['开工','加彩','收工','暂存'].includes(a.operation)){txnHistory.unshift({no:'TX'+String(seq++).padStart(5,'0'),key:freezeAccountKey,account:id(),name:account.name,role:account.role,type:a.operation==='暂存'?'暂存存卡':a.operation==='加彩'?'加彩存卡':a.operation==='开工'?'存卡开工':'收工存卡',coin:c,amount:delta,balance:a.stored[c],recipient:'',remark:a.operation+' · '+a.session+'（存卡余额）',time:now()})}balances[c].stored=a.stored[c]}audit.unshift({type:'开工管理联动',text:a.session,time:now()})}
const baseCreditInfo=creditInfo;
creditInfo=function(c){let b=baseCreditInfo(c);if(!b)return null;let used=sessionCreditUse[c]||0n;return {...b,debt:b.debt+used,available:b.available-used}};
const baseAccountSave=saveAccount;
saveAccount=function(fresh){let old=account;let previous=id();accountSaveInProgress=true;try{baseAccountSave(fresh)}finally{accountSaveInProgress=false}if(old!==account){if(fresh){sessionIdentity=id();sessionCreditUse={}}else sessionIdentity=previous;syncSessionAccount();baseAccountDetail()}};
const baseAccountDetail=detail;
detail=function(){leaveSessions();if(!accountSaveInProgress)syncSessionAccount();baseAccountDetail()};
const baseAccountList=showList;
showList=function(){leaveSessions();baseAccountList()};
const baseAccountForm=accountForm;
accountForm=function(fresh){leaveSessions();baseAccountForm(fresh)};
const baseFreezeReport=freezeReport;
freezeReport=function(){leaveSessions();baseFreezeReport()};
const baseMenu=menu;
menu=function(n){if(n==='开工管理')return openSessions('list');if(n==='佣金占成设置')return openSessions('settings');if(n==='户口管理')return showList();if(n==='冻结列表')return freezeReport();if(n==='操作日志')leaveSessions();return baseMenu(n)};
const workspaceTabActions={'开工管理':()=>openSessions('list'),'新开工':()=>openSessions('open'),'户口管理':()=>showList(),'户口详情':()=>detail(),'冻结列表':()=>freezeReport()};
let workspaceTabs=Object.keys(workspaceTabActions),workspaceActive='户口管理';
function renderWorkspaceTabs(){const bar=document.querySelector('.layout > .tabs');if(!bar)return;bar.innerHTML=workspaceTabs.map(name=>`<span class="workspace-tab ${workspaceActive===name?'is-current':''}"><button class="tab-main ${workspaceActive===name?'selected':''}" onclick="workspaceTabActions['${name}']()">${name}</button><button class="tab-close" aria-label="关闭${name}" title="关闭${name}" onclick="closeWorkspaceTab('${name}')">×</button></span>`).join('')}
function selectWorkspaceTab(name){if(!workspaceTabActions[name]){workspaceActive='';renderWorkspaceTabs();return}if(!workspaceTabs.includes(name))workspaceTabs.push(name);workspaceActive=name;renderWorkspaceTabs()}
function closeWorkspaceTab(name){const index=workspaceTabs.indexOf(name);if(index<0)return;const current=workspaceActive===name;workspaceTabs.splice(index,1);if(current){const next=workspaceTabs[Math.min(index,workspaceTabs.length-1)];if(next){workspaceTabActions[next]();return}workspaceActive='';leaveSessions();$('pageTitle').textContent='工作台';$('main').innerHTML='<div class="card body"><p>所有页签已关闭，请从左侧菜单打开页面。</p></div>';document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'))}renderWorkspaceTabs()}
const tabBaseActiveNav=activeNav;
activeNav=function(name){tabBaseActiveNav(name);selectWorkspaceTab(document.body.classList.contains('session-mode')?($('pageTitle').textContent==='新开工'?'新开工':'开工管理'):name)};
const tabBaseSessionTitle=sessionTitleChanged;
sessionTitleChanged=function(name){tabBaseSessionTitle(name);if(document.body.classList.contains('session-mode'))selectWorkspaceTab(name==='新开工'?'新开工':'开工管理')};
const tabBaseOpenSessions=openSessions;
openSessions=function(action='list',value=''){tabBaseOpenSessions(action,value);selectWorkspaceTab(action==='open'?'新开工':'开工管理')};
